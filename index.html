<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RMF TERMINAL - RECONSTRUCTION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap');

        :root {
            --yellow: #fce300;
            --bg: #000;
            --border: #333;
            --cyan: #00ffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            height: 100vh; width: 100vw; 
            background: var(--bg); color: #fff; 
            font-family: 'Montserrat Alternates', sans-serif;
            overflow: hidden; 
        }

        body { display: flex; flex-direction: column; padding: 10px; }

        /* HEADER */
        header { 
            height: 50px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        header h1 { font-size: 0.9rem; font-weight: 700; text-transform: uppercase; color: var(--yellow); }
        .clock { color: var(--yellow); font-size: 1.2rem; font-weight: 700; }

        /* KONTENER GŁÓWNY */
        .app-main { display: flex; flex: 1; gap: 15px; min-height: 0; margin-top: 10px; }

        /* SIATKA 5x3 */
        .grid { 
            flex: 1; display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            gap: 8px; 
        }

        .tile {
            background: #0a0a0a; border: 1px solid var(--border); border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; overflow: hidden;
        }

        /* UKŁAD NAPISÓW (ZDJĘCIE 1) */
        .tile .brand-sub { font-size: 0.6rem; color: #666; font-weight: 600; text-transform: uppercase; margin-bottom: 2px; }
        .tile .station-main { font-size: 1rem; font-weight: 700; text-align: center; color: #fff; line-height: 1.1; }

        .tile.active { border-color: var(--yellow); background: #111; }
        .tile.active .station-main { color: var(--yellow); }

        /* FALA ORBITALNA */
        .wave {
            position: absolute; border: 1.5px solid var(--yellow); border-radius: 50%;
            width: 0; height: 0; opacity: 0; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .tile.active .wave { animation: ripple 3s infinite ease-out; }
        .tile.active .wave:nth-child(2) { animation-delay: 1s; }

        @keyframes ripple {
            0% { width: 0; height: 0; opacity: 0.8; }
            100% { width: 250px; height: 250px; opacity: 0; }
        }

        /* SIDEBAR (DESKTOP) / BOTTOM PANEL (MOBILE) */
        .controls-panel { 
            width: 300px; display: flex; flex-direction: column; 
            justify-content: center; gap: 25px; border-left: 1px solid var(--border); padding-left: 15px;
        }

        /* ELEMENTY CENTRALNE (ZDJĘCIE 2 - MOBILE FOCUS) */
        .center-group { display: flex; flex-direction: column; align-items: center; width: 100%; }

        .logo-box {
            border: 2px solid var(--yellow); border-radius: 15px; padding: 15px 30px;
            background: rgba(252, 227, 0, 0.05); margin-bottom: 15px; /* Odstęp ~1cm */
            min-width: 180px; text-align: center;
        }
        .logo-box h2 { font-size: 1.5rem; color: var(--yellow); text-shadow: 0 0 8px var(--yellow); }

        .transport { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
        .btn-svg { width: 30px; height: 30px; fill: #555; cursor: pointer; }
        .btn-play { width: 50px; height: 50px; fill: var(--yellow); }

        .vol-wrapper { 
            display: flex; align-items: center; gap: 10px; width: 90%; 
            margin-top: 5px; /* Odstęp ~1cm od przycisków sterowania */
        }
        .vol-btn { background: none; border: 1px solid var(--yellow); color: var(--yellow); border-radius: 5px; width: 25px; height: 25px; cursor: pointer; font-weight: bold; }
        
        input[type="range"] { flex: 1; appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-runnable-track { background: #222; height: 4px; border: 1px solid var(--yellow); border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { 
            appearance: none; width: 14px; height: 14px; background: var(--cyan); 
            border-radius: 50%; margin-top: -6px; box-shadow: 0 0 10px var(--cyan);
        }

        /* MOBILE AUDYT - PIONOWY */
        @media (max-width: 600px) {
            body { overflow-y: auto; height: auto; }
            .app-main { flex-direction: column; }
            .grid { 
                grid-template-columns: repeat(3, 1fr); 
                grid-template-rows: auto;
                flex: none; gap: 6px;
            }
            .tile { aspect-ratio: 1/1; }
            .controls-panel { 
                width: 100%; border-left: none; border-top: 1px solid var(--border); 
                padding: 20px 0; margin-top: 10px;
            }
            
            /* Tryb poziomy na mobile - blokada rozjeżdżania */
            @media (orientation: landscape) {
                .grid { grid-template-columns: repeat(5, 1fr); }
                .tile { aspect-ratio: 1.4/1; }
            }
        }
    </style>
</head>
<body>

<header>
    <h1 id="status">GRA: WYBIERZ STACJĘ</h1>
    <div class="clock" id="clock">00:00</div>
</header>

<div class="app-main">
    <div class="grid" id="g"></div>

    <div class="controls-panel">
        <div class="center-group">
            <div class="logo-box">
                <h2 id="curS">RMF FM</h2>
            </div>

            <div class="transport">
                <svg class="btn-svg" viewBox="0 0 24 24" onclick="skip(-1)"><path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z"/></svg>
                <svg class="btn-svg btn-play" viewBox="0 0 24 24" onclick="toggle()"><path id="pI" d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>
                <svg class="btn-svg" viewBox="0 0 24 24" onclick="skip(1)"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z"/></svg>
            </div>

            <div class="vol-wrapper">
                <button class="vol-btn" onclick="adjV(-5)">-</button>
                <input type="range" id="v" min="0" max="100" value="50" oninput="setV(this.value)">
                <button class="vol-btn" onclick="adjV(5)">+</button>
            </div>
        </div>
    </div>
</div>

<audio id="a"></audio>

<script>
    const S = [
        { n: 'RMF FM', u: 'https://rs201-krk.rmfstream.pl/rmf_fm' },
        { n: 'RMF MAXXX', u: 'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' },
        { n: 'RMF 80s', u: 'https://rs201-krk.rmfstream.pl/rmf_80s' },
        { n: 'RMF 90s', u: 'https://rs201-krk.rmfstream.pl/rmf_90s' },
        { n: 'RMF 2000', u: 'https://rs201-krk.rmfstream.pl/rmf_2000' },
        { n: 'RMF CHILLOUT', u: 'https://rs201-krk.rmfstream.pl/rmf_chillout' },
        { n: 'RMF CLASSIC', u: 'https://rs201-krk.rmfstream.pl/rmf_classic' },
        { n: 'RMF DANCE', u: 'https://rs201-krk.rmfstream.pl/rmf_dance' },
        { n: 'RMF GOLD', u: 'https://rs201-krk.rmfstream.pl/rmf_gold' },
        { n: 'RMF LATINO', u: 'https://rs201-krk.rmfstream.pl/rmf_latino' },
        { n: 'RMF LOVE', u: 'https://rs201-krk.rmfstream.pl/rmf_love' },
        { n: 'RMF PARTY', u: 'https://rs201-krk.rmfstream.pl/rmf_party' },
        { n: 'RMF POLSKI ROCK', u: 'https://rs201-krk.rmfstream.pl/rmf_polski_rock' },
        { n: 'RMF ROCK', u: 'https://rs201-krk.rmfstream.pl/rmf_rock' },
        { n: 'RMF SMOOTH JAZZ', u: 'https://rs201-krk.rmfstream.pl/rmf_smooth_jazz' }
    ];

    const a = document.getElementById('a'), pI = document.getElementById('pI'), g = document.getElementById('g');
    let cur = -1;

    setInterval(() => {
        const d = new Date();
        document.getElementById('clock').textContent = d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0');
    }, 1000);

    S.forEach((s, i) => {
        const t = document.createElement('div');
        t.className = 'tile';
        t.innerHTML = `<div class="wave"></div><div class="wave"></div><div class="brand-sub">RMF FM</div><div class="station-main">${s.n.replace('RMF ', '')}</div>`;
        t.onclick = () => play(i);
        g.appendChild(t);
    });

    function play(i) {
        cur = i;
        document.querySelectorAll('.tile').forEach((t, idx) => t.classList.toggle('active', idx === i));
        document.getElementById('status').textContent = "GRA: " + S[i].n;
        document.getElementById('curS').textContent = S[i].n;
        a.src = S[i].u; a.play();
        pI.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z');
    }

    function toggle() {
        if(a.paused) { a.play(); pI.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z'); }
        else { a.pause(); pI.setAttribute('d', 'M8,5.14V19.14L19,12.14L8,5.14Z'); }
    }

    function skip(d) { let n = cur + d; if(n>=0 && n<S.length) play(n); }
    function setV(v) { a.volume = v/100; }
    function adjV(d) { const sl = document.getElementById('v'); sl.value = parseInt(sl.value)+d; setV(sl.value); }
</script>
</body>
</html>
