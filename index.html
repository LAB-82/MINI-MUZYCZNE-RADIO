<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber-Yellow Pulse Terminal - FINAL AUDIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* 1. PARAMETRY WIZUALNE (CYBER-YELLOW) */
        :root {
            --yellow: #fce300;
            --bg: #000000;
            --gold: #FFD700;
            --cyan: #00ffff;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Montserrat Alternates', sans-serif !important; 
            touch-action: manipulation;
        }

        html, body { height: 100%; background: var(--bg); color: #fff; overflow: hidden; }

        /* 2. STRUKTURA (STACKED - Z KODU POGLĄDOWEGO) */
        body { 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            gap: 12px; 
        }

        /* NAGŁÓWEK */
        .status-header {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.05); border: 2px solid #333;
            border-radius: 15px; padding: 12px 18px; flex-shrink: 0;
        }
        .status-msg { color: var(--yellow); font-weight: 700; text-transform: uppercase; font-size: 1.1rem; }
        .clock { color: var(--yellow); font-weight: 700; font-size: 1.8rem; }

        /* PANEL ŚRODKOWY (SIATKA) */
        .main-content {
            flex: 1; min-height: 0; display: flex; flex-direction: column;
        }

        .grid-scroll {
            flex: 1; overflow-y: auto; padding-right: 5px;
        }

        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }

        /* KAFELKI (ORYGINALNE ROZMIARY I STYL) */
        .tile {
            background: rgba(255, 255, 255, 0.05); border: 1px solid #444;
            border-radius: 12px; min-height: 60px; padding: 8px;
            display: flex; align-items: center; justify-content: center;
            text-align: center; cursor: pointer; position: relative; overflow: hidden;
            transition: 0.3s;
        }
        .tile .station-name { font-weight: 700; font-size: 0.85rem; z-index: 5; color: #fff; line-height: 1.2; }
        .tile .station-name span { display: block; margin-top: 4px; font-size: 0.7rem; font-weight: 400; }

        /* AKTYWNY KAFELEK + TWOJE PULSOWANIE */
        .tile.active { border-color: var(--yellow); box-shadow: inset 0 0 15px rgba(252, 227, 0, 0.3); }
        .tile.active .station-name { color: var(--yellow); }
        .tile.active::before, .tile.active .w2, .tile.active .w3 {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(252, 227, 0, 0.15); border-radius: 50%; width: 0; height: 0;
        }
        .tile.active::before { animation: p 4s infinite; }
        .tile.active .w2 { animation: p 4s infinite 1.3s; }
        .tile.active .w3 { animation: p 4s infinite 2.6s; }
        @keyframes p { 0% { width: 0; height: 0; opacity: 0.8; } 100% { width: 300%; height: 300%; opacity: 0; } }

        /* DOLNY PANEL (LOGO + STEROWANIE) */
        .bottom-ui {
            display: flex; flex-direction: column; gap: 15px; flex-shrink: 0;
        }

        .logo-box {
            background: #000; border: 3px solid var(--yellow); border-radius: 20px;
            padding: 15px; text-align: center; box-shadow: 0 0 20px rgba(252, 227, 0, 0.3);
        }
        .logo-text { color: var(--yellow); font-size: 1.8rem; font-weight: 700; }

        .player-controls {
            background: rgba(255, 255, 255, 0.03); border: 1px solid #333; border-radius: 20px;
            padding: 15px; display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap;
        }

        .mdi { width: 40px; height: 40px; fill: #888; cursor: pointer; transition: 0.2s; }
        .mdi:hover { fill: var(--yellow); }
        .play-main { width: 60px; height: 60px; fill: var(--yellow); }

        .vol-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px; }
        .vol-btn {
            width: 44px; height: 38px; background: #111; border: 2px solid var(--gold);
            border-radius: 10px; color: var(--yellow); font-weight: 700; cursor: pointer;
        }
        input[type="range"] { 
            flex: 1; height: 38px; background: #111; border: 2px solid var(--gold); border-radius: 10px; 
            appearance: none; cursor: pointer; 
        }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; background: var(--gold); border-radius: 50%; }

        /* --- AUDYT: DESKTOP RECONSTRUCTION --- */
        @media (min-width: 1025px) {
            body { padding: 30px; gap: 25px; }
            .status-header { padding: 20px 30px; }
            .clock { font-size: 2.8rem; }
            
            /* Tu dzieje się magia z kodu poglądowego: zmiana kierunku na poziomy tylko na desktopie */
            .main-content { flex-direction: row; gap: 25px; }
            .grid { grid-template-columns: repeat(5, 1fr); gap: 15px; }
            .tile { min-height: 80px; }
            .tile .station-name { font-size: 1.1rem; }
            .tile .station-name span { margin-top: 19px; font-size: 0.9rem; } /* 0.5cm */

            .bottom-ui { width: 350px; }
            .logo-box { flex: 1; display: flex; align-items: center; justify-content: center; }
            .logo-text { font-size: 2.8rem; }
            .player-controls { padding: 25px; flex-direction: column; }
            .vol-wrap { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="status-header">
        <div class="status-msg" id="status">System Ready</div>
        <div class="clock" id="clock">00:00:00</div>
    </div>

    <div class="main-content">
        <div class="grid-scroll">
            <div class="grid" id="grid"></div>
        </div>

        <div class="bottom-ui">
            <div class="logo-box">
                <div class="logo-text" id="activeName">RMF FM</div>
            </div>

            <div class="player-controls">
                <div style="display: flex; align-items: center; gap: 20px;">
                    <svg class="mdi" viewBox="0 0 24 24" onclick="change(-1)"><path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z"/></svg>
                    <svg class="mdi play-main" viewBox="0 0 24 24" onclick="toggle()"><path id="pIco" d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>
                    <svg class="mdi" viewBox="0 0 24 24" onclick="change(1)"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z"/></svg>
                </div>
                
                <div class="vol-wrap">
                    <button class="vol-btn" onclick="v(-5)">-</button>
                    <input type="range" id="vol" min="0" max="100" value="50" oninput="uV(this.value)">
                    <button class="vol-btn" onclick="v(5)">+</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="aud"></audio>

<script>
    const STATIONS = [
        { n: 'RMF FM<span>FM</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_fm' },
        { n: 'RMF FM<span>Maxx</span>', u: 'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' },
        { n: 'RMF FM<span>80s</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_80s' },
        { n: 'RMF FM<span>90s</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_90s' },
        { n: 'RMF FM<span>2000</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_2000' },
        { n: 'RMF FM<span>Chillout</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_chillout' },
        { n: 'RMF FM<span>Classic</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_classic' },
        { n: 'RMF FM<span>Dance</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_dance' },
        { n: 'RMF FM<span>Gold</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_gold' },
        { n: 'RMF FM<span>Latino</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_latino' },
        { n: 'RMF FM<span>Love</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_love' },
        { n: 'RMF FM<span>Party</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_party' },
        { n: 'RMF FM<span>Polski Rock</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_polski_rock' },
        { n: 'RMF FM<span>Rock</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_rock' },
        { n: 'RMF FM<span>Smooth Jazz</span>', u: 'https://rs201-krk.rmfstream.pl/rmf_smooth_jazz' }
    ];

    const aud = document.getElementById('aud');
    const pIco = document.getElementById('pIco');
    const status = document.getElementById('status');
    const activeName = document.getElementById('activeName');
    const volS = document.getElementById('vol');
    let cur = -1;

    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);

    const grid = document.getElementById('grid');
    STATIONS.forEach((s, i) => {
        const t = document.createElement('div');
        t.className = 'tile';
        t.innerHTML = `<div class="station-name">${s.n}</div><div class="w2"></div><div class="w3"></div>`;
        t.onclick = () => play(i);
        grid.appendChild(t);
    });

    function play(idx) {
        cur = idx;
        const s = STATIONS[idx];
        document.querySelectorAll('.tile').forEach((t, i) => t.classList.toggle('active', i === idx));
        status.textContent = "Connecting...";
        aud.pause(); aud.src = s.u; aud.load();
        aud.play().then(() => {
            const clean = s.n.replace('<span>', ' ').replace('</span>', '');
            status.textContent = "Live: " + clean;
            activeName.textContent = clean;
            pIco.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z');
        });
    }

    function toggle() {
        if (cur === -1) { play(0); return; }
        if (aud.paused) { aud.play(); pIco.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z'); }
        else { aud.pause(); pIco.setAttribute('d', 'M8,5.14V19.14L19,12.14L8,5.14Z'); }
    }

    function change(d) {
        let n = cur + d;
        if (n >= 0 && n < STATIONS.length) play(n);
    }

    function uV(v) { 
        aud.volume = v / 100; 
        v == 0 ? volS.style.boxShadow = "0 0 15px var(--cyan)" : volS.style.boxShadow = "none";
    }

    function v(s) {
        let n = Math.min(100, Math.max(0, parseInt(volS.value) + s));
        volS.value = n; uV(n);
    }
    uV(50);
</script>
</body>
</html>
