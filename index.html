<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Yellow Pulse Radio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; 
            background: #050505; 
            color: #fce300; 
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* TŁO TECHNO-GRID */
        body::before {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(252, 227, 0, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(252, 227, 0, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        /* NAGŁÓWEK / STATUS */
        .status {
            background: #000;
            border-bottom: 3px solid #fce300;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(252, 227, 0, 0.5);
            letter-spacing: 2px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }

        .status-text::before { content: "◢ "; color: #fce300; }

        /* PANEL KAFELKÓW */
        .panel {
            flex: 1;
            background: rgba(13, 13, 13, 0.9);
            margin: 15px;
            border: 1px solid rgba(252, 227, 0, 0.2);
            border-radius: 4px;
            padding: 15px;
            display: flex;
            overflow: hidden;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 100%;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* CUSTOM SCROLLBAR */
        .grid::-webkit-scrollbar { width: 6px; }
        .grid::-webkit-scrollbar-thumb { background: #fce300; }

        /* TILE (KAFELEK) */
        .tile {
            background: #111;
            border: 2px solid #222;
            color: #fce300;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            min-height: 70px;
            padding: 10px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            transition: 0.2s;
            clip-path: polygon(10% 0, 100% 0, 100% 85%, 90% 100%, 0 100%, 0 15%);
        }

        .tile:hover {
            background: #1a1a1a;
            border-color: #fce300;
            box-shadow: 0 0 15px rgba(252, 227, 0, 0.3);
        }

        .tile.active {
            background: #fce300;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 25px #fce300;
            animation: pulse-active 1.5s infinite linear;
        }

        @keyframes pulse-active {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.3) contrast(1.2); }
            100% { filter: brightness(1); }
        }

        /* CENTRALNE LOGO */
        .logo-box {
            padding: 20px;
            background: linear-gradient(to right, transparent, #000, transparent);
            text-align: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 8vh;
            font-weight: 800;
            color: #fce300;
            text-shadow: 0 0 20px #fce300, 0 0 40px rgba(252, 227, 0, 0.5);
            -webkit-text-stroke: 1px rgba(0,0,0,0.5);
        }

        /* KONTROLERY */
        .controls {
            background: #fce300;
            padding: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .ctrl-btn {
            background: #000;
            border: 2px solid #000;
            color: #fce300;
            height: 45px;
            padding: 0 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            clip-path: polygon(15% 0, 100% 0, 85% 100%, 0 100%);
        }

        .ctrl-btn:hover:not(:disabled) {
            background: #222;
            color: #fff;
        }

        .ctrl-btn:disabled { opacity: 0.2; cursor: not-allowed; }
        .ctrl-btn.active { background: #fff; color: #000; border-color: #fff; }

        /* SUWAK GŁOŚNOŚCI */
        input[type="range"] {
            flex: 1;
            height: 10px;
            background: #000;
            appearance: none;
            outline: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            background: #000;
            border: 3px solid #fff;
            border-radius: 50%;
        }

        /* RESPONSIVE GRID */
        @media (max-width:1100px){.grid{grid-template-columns:repeat(4,1fr);}}
        @media (max-width:850px){.grid{grid-template-columns:repeat(3,1fr);}}
        @media (max-width:640px){
            .grid{grid-template-columns:repeat(2,1fr);}
            .logo{font-size:5vh;}
            .controls{flex-wrap:wrap; justify-content:center;}
            .ctrl-btn {flex: 1 1 30%;}
        }
    </style>
</head>
<body>

<div class="status">
    <span class="status-text" id="statusText">System Standby</span>
    <span id="clock">00:00:00</span>
</div>

<div class="panel">
    <div class="grid" id="grid"></div>
</div>

<div class="logo-box">
    <div class="logo" id="mainDisplay">RMF FM</div>
</div>

<div class="controls">
    <button class="ctrl-btn" id="playBtn" disabled>PLAY</button>
    <button class="ctrl-btn" id="stopBtn" disabled>STOP</button>
    <button class="ctrl-btn" id="prevBtn" disabled>PREV</button>
    <button class="ctrl-btn" id="nextBtn" disabled>NEXT</button>
    <input type="range" id="volume" min="0" max="100" value="50">
    <button class="ctrl-btn" id="muteBtn">MUTE</button>
</div>

<audio id="player"></audio>

<script>
    const STATIONS = [
        { name:'RMF FM', url:'https://rs201-krk.rmfstream.pl/rmf_fm' },
        { name:'RMF MAXX', url:'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' },
        { name:'RMF 80s', url:'https://rs201-krk.rmfstream.pl/rmf_80s' },
        { name:'RMF 90s', url:'https://rs201-krk.rmfstream.pl/rmf_90s' },
        { name:'RMF 2000', url:'https://rs201-krk.rmfstream.pl/rmf_2000' },
        { name:'RMF CHILLOUT', url:'https://rs201-krk.rmfstream.pl/rmf_chillout' },
        { name:'RMF CLASSIC', url:'https://rs201-krk.rmfstream.pl/rmf_classic' },
        { name:'RMF DANCE', url:'https://rs201-krk.rmfstream.pl/rmf_dance' },
        { name:'RMF GOLD', url:'https://rs201-krk.rmfstream.pl/rmf_gold' },
        { name:'RMF LATINO', url:'https://rs201-krk.rmfstream.pl/rmf_latino' },
        { name:'RMF LOVE', url:'https://rs201-krk.rmfstream.pl/rmf_love' },
        { name:'RMF PARTY', url:'https://rs201-krk.rmfstream.pl/rmf_party' },
        { name:'RMF POLSKI ROCK', url:'https://rs201-krk.rmfstream.pl/rmf_polski_rock' },
        { name:'RMF ROCK', url:'https://rs201-krk.rmfstream.pl/rmf_rock' },
        { name:'RMF SMOOTH JAZZ', url:'https://rs201-krk.rmfstream.pl/rmf_smooth_jazz' }
    ];

    const player = document.getElementById('player');
    const grid = document.getElementById('grid');
    const statusText = document.getElementById('statusText');
    const mainDisplay = document.getElementById('mainDisplay');
    const clock = document.getElementById('clock');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volume = document.getElementById('volume');
    const muteBtn = document.getElementById('muteBtn');

    let currentIndex = -1;
    let lastVolume = 0.5;
    player.volume = 0.5;

    // CLOCK
    setInterval(() => clock.textContent = new Date().toLocaleTimeString(), 1000);

    // RENDER GRID
    STATIONS.forEach((st, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.innerHTML = st.name;
        tile.onclick = () => playStation(i);
        grid.appendChild(tile);
    });

    function updateTileActive() {
        document.querySelectorAll('.tile').forEach((t, i) => {
            t.classList.toggle('active', i === currentIndex);
        });
    }

    function playStation(index) {
        if(index < 0 || index >= STATIONS.length) return;
        const st = STATIONS[index];
        player.pause();
        currentIndex = index;
        updateTileActive();

        statusText.textContent = 'CONNECTING: ' + st.name;
        mainDisplay.textContent = st.name;
        player.src = st.url;

        player.play().then(() => {
            statusText.textContent = 'BROADCASTING: ' + st.name;
            playBtn.classList.add('active');
            [playBtn, stopBtn, prevBtn, nextBtn].forEach(b => b.disabled = false);
        }).catch(e => {
            statusText.textContent = 'CONNECTION ERROR';
        });
    }

    playBtn.onclick = () => {
        if (currentIndex === -1) return;
        if (player.paused) {
            player.play();
            playBtn.classList.add('active');
            statusText.textContent = 'BROADCASTING: ' + STATIONS[currentIndex].name;
        } else {
            player.pause();
            playBtn.classList.remove('active');
            statusText.textContent = 'SIGNAL PAUSED';
        }
    };

    stopBtn.onclick = () => {
        player.pause();
        player.src = "";
        playBtn.classList.remove('active');
        statusText.textContent = 'TERMINATED';
        currentIndex = -1;
        updateTileActive();
    };

    prevBtn.onclick = () => playStation(currentIndex - 1);
    nextBtn.onclick = () => playStation(currentIndex + 1);

    volume.oninput = (e) => {
        const vol = e.target.value / 100;
        player.volume = vol;
        lastVolume = vol;
        if(vol > 0) muteBtn.classList.remove('active');
    };

    muteBtn.onclick = () => {
        if (player.volume > 0) {
            lastVolume = player.volume;
            player.volume = 0;
            volume.value = 0;
            muteBtn.classList.add('active');
        } else {
            player.volume = lastVolume || 0.5;
            volume.value = player.volume * 100;
            muteBtn.classList.remove('active');
        }
    };
</script>
</body>
</html>
