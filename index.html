<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RMF TERMINAL - FINAL RECONSTRUCTION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap');

        :root {
            --yellow: #fce300;
            --bg: #000;
            --tile: #0a0a0a;
            --border: #1a1a1a;
            --cyan: #00ffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100vh; width: 100vw; 
            background: var(--bg); color: #fff; 
            font-family: 'Montserrat Alternates', sans-serif;
            overflow: hidden; 
        }

        body { display: flex; flex-direction: column; padding: 2vh; }

        header { 
            height: 50px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); margin-bottom: 2vh; flex-shrink: 0;
        }
        .header-info { font-size: 16px; font-weight: 700; color: var(--yellow); text-transform: uppercase; }
        .clock { color: var(--yellow); font-size: 24px; font-weight: 700; text-shadow: 0 0 10px rgba(252, 227, 0, 0.5); }

        .app-content { display: flex; flex: 1; gap: 3vw; min-height: 0; }

        /* GRID 5x3 */
        .grid { 
            flex: 1.4; display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            gap: 12px; 
        }

        .tile {
            background: var(--tile); border: 1px solid var(--border); border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; overflow: hidden; /* MASKOWANIE FAL */
        }

        /* TYPOGRAFIA KAFELKÓW (ZGODNIE ZE ZDJĘCIEM) */
        .tile .t-top { font-size: 18px; font-weight: 700; color: #fff; line-height: 1; }
        .tile .t-bottom { font-size: 11px; font-weight: 600; color: #fff; margin-top: 4px; text-align: center; }

        /* AKTYWNY KAFELEK */
        .tile.active { border: 2px solid var(--yellow); background: #111; }
        .tile.active .t-top, .tile.active .t-bottom { color: var(--yellow); }

        /* FALE (WIDOCZNE TYLKO W OBRĘBIE KAFELKA) */
        .waves {
            position: absolute; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; opacity: 0;
        }
        .tile.active .waves { opacity: 1; }
        .wave {
            position: absolute; border: 1.5px solid var(--cyan); border-radius: 50%;
            width: 10px; height: 10px; opacity: 0;
            animation: ripple 3s infinite linear;
        }
        .wave:nth-child(2) { animation-delay: 1s; }
        .wave:nth-child(3) { animation-delay: 2s; }

        @keyframes ripple {
            0% { width: 0; height: 0; opacity: 0.8; }
            100% { width: 250%; height: 250%; opacity: 0; }
        }

        /* PRAWY PANEL */
        .sidebar { 
            flex: 0.6; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; gap: 4vh;
            border-left: 1px solid var(--border); padding-left: 3vw;
        }

        /* STAŁA RAMKA LOGO */
        .logo-display {
            width: 100%; max-width: 320px; aspect-ratio: 16/10;
            border: 2.5px solid var(--yellow); border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 30px rgba(252, 227, 0, 0.2);
        }
        .logo-display h2 { font-size: 46px; color: var(--yellow); text-shadow: 0 0 15px var(--yellow); }
        .logo-display p { font-size: 11px; color: var(--yellow); font-weight: 700; text-transform: uppercase; margin-top: 5px; }

        /* STEROWANIE */
        .controls { display: flex; align-items: center; gap: 3vw; }
        .c-svg { width: 35px; height: 35px; fill: #444; cursor: pointer; }
        .c-play { width: 70px; height: 70px; fill: var(--yellow); }

        /* GŁOŚNOŚĆ */
        .vol-box { display: flex; align-items: center; gap: 15px; width: 320px; }
        .vol-btn { 
            width: 35px; height: 35px; border: 1.5px solid var(--yellow); border-radius: 8px;
            background: none; color: var(--yellow); font-weight: 700; cursor: pointer;
        }
        .vol-bar {
            flex: 1; height: 35px; border: 1.5px solid var(--yellow); border-radius: 8px;
            padding: 0 12px; display: flex; align-items: center;
        }
        input[type="range"] { flex: 1; appearance: none; background: transparent; cursor: pointer; }
        input[type="range"]::-webkit-slider-runnable-track { background: #222; height: 4px; border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { 
            appearance: none; width: 18px; height: 18px; background: var(--cyan); 
            border-radius: 50%; margin-top: -7px; box-shadow: 0 0 10px var(--cyan);
        }

        /* MOBILE PORTRAIT (BEZ ZMIAN W LOGICE) */
        @media (max-width: 600px) {
            .app-content { flex-direction: column; }
            .grid { 
                grid-template-columns: repeat(3, 1fr); 
                grid-template-rows: repeat(5, 1fr);
                height: 50vh; flex: none;
            }
            .sidebar { 
                width: 100%; height: 40vh; border-left: none; border-top: 1px solid var(--border);
                padding: 15px 0; gap: 20px;
            }
            .logo-display { width: 220px; height: 120px; }
            .logo-display h2 { font-size: 32px; }
            .vol-box { width: 90%; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-info" id="playing-now">GRA: RMF FM</div>
    <div class="clock" id="timer">00:00</div>
</header>

<div class="app-content">
    <div class="grid" id="station-grid"></div>

    <aside class="sidebar">
        <div class="logo-display">
            <h2>RMF FM</h2>
            <p>Najlepsza muzyka</p>
        </div>

        <div class="controls">
            <svg class="c-svg" viewBox="0 0 24 24" onclick="skip(-1)"><path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z"/></svg>
            <svg class="c-svg c-play" viewBox="0 0 24 24" onclick="toggle()"><path id="p-ico" d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>
            <svg class="c-svg" viewBox="0 0 24 24" onclick="skip(1)"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z"/></svg>
        </div>

        <div class="vol-box">
            <button class="vol-btn" onclick="adj(-5)">-</button>
            <div class="vol-bar">
                <input type="range" id="v-range" min="0" max="100" value="50" oninput="setV(this.value)">
            </div>
            <button class="vol-btn" onclick="adj(5)">+</button>
        </div>
    </aside>
</div>

<audio id="player"></audio>

<script>
    const STATIONS = [
        { n: 'RMF FM', s: 'RMF FM' }, { n: 'RMF MAXXX', s: 'Maxxx' },
        { n: 'RMF 80s', s: '80s' }, { n: 'RMF 90s', s: '90s' },
        { n: 'RMF 2000', s: '2000' }, { n: 'RMF CHILLOUT', s: 'Chillout' },
        { n: 'RMF CLASSIC', s: 'Classic' }, { n: 'RMF DANCE', s: 'Dance' },
        { n: 'RMF GOLD', s: 'Gold' }, { n: 'RMF LATINO', s: 'Latino' },
        { n: 'RMF LOVE', s: 'Love' }, { n: 'RMF PARTY', s: 'Party' },
        { n: 'RMF POLSKI ROCK', s: 'Polski Rock' }, { n: 'RMF ROCK', s: 'Rock' },
        { n: 'RMF SMOOTH JAZZ', s: 'Smooth Jazz' }
    ];

    const player = document.getElementById('player'), ico = document.getElementById('p-ico'), grid = document.getElementById('station-grid');
    let current = -1;

    function clock() {
        const d = new Date();
        document.getElementById('timer').textContent = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
    }
    setInterval(clock, 1000); clock();

    STATIONS.forEach((s, i) => {
        const t = document.createElement('div');
        t.className = 'tile';
        t.innerHTML = `
            <div class="waves"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
            <div class="t-top">RMF FM</div>
            <div class="t-bottom">${s.s}</div>
        `;
        t.onclick = () => play(i);
        grid.appendChild(t);
    });

    function play(i) {
        current = i;
        document.querySelectorAll('.tile').forEach((t, idx) => t.classList.toggle('active', idx === i));
        document.getElementById('playing-now').textContent = "GRA: " + STATIONS[i].n;
        const streamBase = "https://rs201-krk.rmfstream.pl/";
        const slug = STATIONS[i].n.toLowerCase().replace(' ', '_');
        player.src = (STATIONS[i].n === 'RMF MAXXX') ? 'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' : streamBase + slug;
        player.play();
        ico.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z');
    }

    function toggle() {
        if(player.paused) { player.play(); ico.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z'); }
        else { player.pause(); ico.setAttribute('d', 'M8,5.14V19.14L19,12.14L8,5.14Z'); }
    }

    function skip(d) { let n = current + d; if(n >= 0 && n < STATIONS.length) play(n); }
    function setV(v) { player.volume = v / 100; }
    function adj(d) { const r = document.getElementById('v-range'); r.value = parseInt(r.value) + d; setV(r.value); }
</script>
</body>
</html>
