<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RMF - AUDYT FINALNY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap');

        :root { --yellow: #fce300; --bg: #000; --border: #222; --cyan: #00ffff; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; width: 100%; 
            background: var(--bg); color: #fff; 
            font-family: 'Montserrat Alternates', sans-serif;
            overflow: hidden; /* BLOKADA SCROLLA */
        }

        body { display: flex; flex-direction: column; padding: 10px; height: 100vh; }

        header { 
            height: 40px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .title { font-size: 14px; font-weight: 700; color: var(--yellow); }
        .clock { color: var(--yellow); font-size: 18px; font-weight: 700; }

        .app-content { display: flex; flex: 1; min-height: 0; margin-top: 10px; gap: 15px; }

        /* SIATKA - NA SZTYWNO 50% WYSOKOŚCI NA MOBILE */
        .grid { 
            flex: 1; display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            gap: 8px;
        }

        .tile {
            background: #0d0d0d; border: 1px solid var(--border); border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        /* TYPOGRAFIA ZE ZDJĘĆ */
        .tile .sub { font-size: 8px; color: #666; font-weight: 600; text-transform: uppercase; }
        .tile .main { font-size: 14px; font-weight: 700; text-align: center; margin-top: 2px; }

        .tile.active { border: 2px solid var(--yellow); }
        .tile.active .main { color: var(--yellow); }

        /* KONTROLER - PRECYZYJNE ODSTĘPY */
        .controls-aside { 
            width: 300px; display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
        }

        .logo-frame {
            border: 2px solid var(--yellow); border-radius: 15px;
            width: 220px; padding: 20px 10px; text-align: center;
            margin-bottom: 25px; /* OKOŁO 1CM NAD PRZYCISKAMI */
            background: rgba(252, 227, 0, 0.05);
        }

        .transport-btns { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; }
        .svg-btn { width: 30px; height: 30px; fill: #444; }
        .svg-play { width: 55px; height: 55px; fill: var(--yellow); }

        .vol-container { 
            display: flex; align-items: center; gap: 10px; width: 220px;
            margin-top: 5px; /* OKOŁO 1CM POD PRZYCISKAMI */
        }
        
        input[type="range"] { flex: 1; appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-runnable-track { background: #333; height: 4px; border: 1px solid var(--yellow); }
        input[type="range"]::-webkit-slider-thumb { 
            appearance: none; width: 16px; height: 16px; background: var(--cyan); border-radius: 50%; margin-top: -7px;
        }

        /* NAPRAWA MOBILE - ZGODNIE Z TWOIM ZDJĘCIEM 2 */
        @media (max-width: 600px) {
            .app-content { flex-direction: column; }
            .grid { 
                height: 50vh; /* ZABIERA TYLKO POŁOWĘ EKRANU */
                grid-template-columns: repeat(3, 1fr); 
                grid-template-rows: repeat(5, 1fr);
                flex: none;
            }
            .controls-aside { 
                width: 100%; height: 40vh; /* POZOSTAŁA CZĘŚĆ EKRANU */
                justify-content: center;
            }
            .tile .main { font-size: 12px; }
        }
    </style>
</head>
<body>

<header>
    <div class="title" id="top-info">GRA: WYBIERZ STACJĘ</div>
    <div class="clock" id="clock">00:00</div>
</header>

<div class="app-content">
    <div class="grid" id="st-grid"></div>

    <div class="controls-aside">
        <div class="logo-frame">
            <h2 id="st-name" style="color:var(--yellow); font-size: 24px;">RMF FM</h2>
            <p style="color:var(--yellow); font-size: 10px; font-weight: 700;">NAJLEPSZA MUZYKA</p>
        </div>

        <div class="transport-btns">
            <svg class="svg-btn" viewBox="0 0 24 24" onclick="step(-1)"><path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z"/></svg>
            <svg class="svg-play" viewBox="0 0 24 24" onclick="togglePlay()"><path id="p-ico" d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>
            <svg class="svg-btn" viewBox="0 0 24 24" onclick="step(1)"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z"/></svg>
        </div>

        <div class="vol-container">
            <span style="color:var(--yellow); font-weight: bold;">-</span>
            <input type="range" id="v-range" min="0" max="100" value="50" oninput="setV(this.value)">
            <span style="color:var(--yellow); font-weight: bold;">+</span>
        </div>
    </div>
</div>

<audio id="player"></audio>

<script>
    const STATIONS = [
        { n: 'RMF FM', u: 'https://rs201-krk.rmfstream.pl/rmf_fm' },
        { n: 'RMF MAXXX', u: 'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' },
        { n: 'RMF 80s', u: 'https://rs201-krk.rmfstream.pl/rmf_80s' },
        { n: 'RMF 90s', u: 'https://rs201-krk.rmfstream.pl/rmf_90s' },
        { n: 'RMF 2000', u: 'https://rs201-krk.rmfstream.pl/rmf_2000' },
        { n: 'RMF CHILLOUT', u: 'https://rs201-krk.rmfstream.pl/rmf_chillout' },
        { n: 'RMF CLASSIC', u: 'https://rs201-krk.rmfstream.pl/rmf_classic' },
        { n: 'RMF DANCE', u: 'https://rs201-krk.rmfstream.pl/rmf_dance' },
        { n: 'RMF GOLD', u: 'https://rs201-krk.rmfstream.pl/rmf_gold' },
        { n: 'RMF LATINO', u: 'https://rs201-krk.rmfstream.pl/rmf_latino' },
        { n: 'RMF LOVE', u: 'https://rs201-krk.rmfstream.pl/rmf_love' },
        { n: 'RMF PARTY', u: 'https://rs201-krk.rmfstream.pl/rmf_party' },
        { n: 'RMF POLSKI ROCK', u: 'https://rs201-krk.rmfstream.pl/rmf_polski_rock' },
        { n: 'RMF ROCK', u: 'https://rs201-krk.rmfstream.pl/rmf_rock' },
        { n: 'RMF SMOOTH JAZZ', u: 'https://rs201-krk.rmfstream.pl/rmf_smooth_jazz' }
    ];

    const player = document.getElementById('player'), pIco = document.getElementById('p-ico'), grid = document.getElementById('st-grid');
    let curIdx = -1;

    setInterval(() => {
        const d = new Date();
        document.getElementById('clock').textContent = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
    }, 1000);

    STATIONS.forEach((s, i) => {
        const t = document.createElement('div');
        t.className = 'tile';
        t.innerHTML = `<div class="sub">RMF FM</div><div class="main">${s.n.replace('RMF ', '')}</div>`;
        t.onclick = () => play(i);
        grid.appendChild(t);
    });

    function play(i) {
        curIdx = i;
        document.querySelectorAll('.tile').forEach((t, idx) => t.classList.toggle('active', idx === i));
        document.getElementById('top-info').textContent = "GRA: " + STATIONS[i].n;
        document.getElementById('st-name').textContent = STATIONS[i].n;
        player.src = STATIONS[i].u; player.play();
        pIco.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z');
    }

    function togglePlay() {
        if(player.paused) { player.play(); pIco.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z'); }
        else { player.pause(); pIco.setAttribute('d', 'M8,5.14V19.14L19,12.14L8,5.14Z'); }
    }

    function step(d) { let n = curIdx + d; if(n >= 0 && n < STATIONS.length) play(n); }
    function setV(v) { player.volume = v / 100; }
</script>
</body>
</html>
