<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RMF Terminal - Pro Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@600;700&display=swap');
        
        :root {
            --yellow: #fce300;
            --active-bg: #1a1a1a;
            --border: #333;
            --cyan: #00ffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #000; color: #fff; overflow: hidden; font-family: 'Montserrat Alternates', sans-serif; }
        
        body { display: flex; flex-direction: column; padding: 20px; gap: 15px; }

        /* GÓRNY PASEK */
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .playing-info { font-weight: 700; font-size: 1.2rem; letter-spacing: 1px; }
        .time { color: var(--yellow); font-size: 1.4rem; font-weight: 700; }

        /* GŁÓWNY KONTENER (SIATKA + SIDEBAR) */
        .main-container { display: flex; flex: 1; gap: 30px; overflow: hidden; }

        /* LEWA STRONA: SIATKA */
        .grid-section { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding-right: 10px; }

        .tile {
            background: #0a0a0a; border: 1px solid var(--border); border-radius: 12px;
            min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: all 0.3s ease;
        }

        .tile .sub-name { font-size: 0.6rem; color: #666; text-transform: uppercase; margin-bottom: 5px; }
        .tile .main-name { font-size: 1.1rem; font-weight: 700; text-align: center; }

        /* EFEKT AKTYWNEJ STACJI ZE ZDJĘCIA (OKREGI) */
        .tile.active { border-color: var(--yellow); background: var(--active-bg); }
        .tile.active .main-name { color: var(--yellow); }
        
        .tile.active::before {
            content: ""; position: absolute; width: 80px; height: 80px;
            border: 2px solid rgba(252, 227, 0, 0.4); border-radius: 50%;
            animation: ripple 2s infinite ease-out;
        }
        @keyframes ripple { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        /* PRAWA STRONA: SIDEBAR (LOGO I KONTROLA) */
        .sidebar { width: 320px; display: flex; flex-direction: column; align-items: center; gap: 40px; border-left: 1px solid var(--border); padding-left: 30px; justify-content: center; }

        .station-brand { text-align: center; }
        .brand-sub { color: var(--yellow); font-size: 0.7rem; font-weight: 700; margin-bottom: 15px; }
        
        .logo-display {
            border: 2px solid var(--yellow); border-radius: 20px; padding: 40px 20px;
            box-shadow: 0 0 20px rgba(252, 227, 0, 0.2); width: 100%; text-align: center;
            background: rgba(252, 227, 0, 0.05);
        }
        .logo-display h2 { font-size: 2.5rem; color: var(--yellow); text-shadow: 0 0 10px var(--yellow); }
        .logo-display p { font-size: 0.6rem; color: var(--yellow); margin-top: 10px; font-weight: 700; }

        /* PRZYCISKI STEROWANIA */
        .transport-btns { display: flex; align-items: center; gap: 30px; }
        .btn-icon { fill: #666; width: 30px; height: 30px; cursor: pointer; transition: 0.2s; }
        .btn-icon:hover { fill: #fff; }
        .btn-play { fill: var(--yellow); width: 50px; height: 50px; }

        /* VOLUMER ZE ZDJĘCIA */
        .volume-container { display: flex; align-items: center; gap: 15px; width: 100%; }
        .vol-icon { fill: var(--yellow); width: 15px; }
        
        input[type="range"] {
            flex: 1; appearance: none; background: transparent; cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            background: #333; height: 4px; border-radius: 2px; border: 1px solid var(--yellow);
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none; height: 14px; width: 14px; background: var(--cyan);
            border-radius: 50%; margin-top: -6px; box-shadow: 0 0 10px var(--cyan);
        }

        /* MOBILE OVERRIDE */
        @media (max-width: 1000px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 20px; }
            .grid-section { grid-template-columns: repeat(3, 1fr); }
            .logo-display { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="playing-info" id="status">GRA: RMF FM</div>
    <div class="time" id="clock">20:52</div>
</div>

<div class="main-container">
    <div class="grid-section" id="grid"></div>

    <div class="sidebar">
        <div class="station-brand">
            <div class="brand-sub">RMF FM - NAJLEPSZA MUZYKA</div>
            <div class="logo-display">
                <h2 id="logo-name">RMF FM</h2>
                <p>NAJLEPSZA MUZYKA</p>
            </div>
        </div>

        <div class="transport-btns">
            <svg class="btn-icon" viewBox="0 0 24 24" onclick="change(-1)"><path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z"/></svg>
            <svg class="btn-icon btn-play" viewBox="0 0 24 24" onclick="toggle()"><path id="play-ico" d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>
            <svg class="btn-icon" viewBox="0 0 24 24" onclick="change(1)"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z"/></svg>
        </div>

        <div class="volume-container">
            <svg class="vol-icon" viewBox="0 0 24 24"><path d="M3,9H7L12,4V20L7,15H3V9Z"/></svg>
            <input type="range" id="vol" min="0" max="100" value="50" oninput="updateVol(this.value)">
            <svg class="vol-icon" viewBox="0 0 24 24"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.01,19.86 21,16.28 21,12C21,7.72 18.01,4.14 14,3.23Z"/></svg>
        </div>
    </div>
</div>

<audio id="player"></audio>

<script>
    const STATIONS = [
        { n: 'RMF FM', u: 'https://rs201-krk.rmfstream.pl/rmf_fm' },
        { n: 'RMF MAXXX', u: 'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' },
        { n: 'RMF 80s', u: 'https://rs201-krk.rmfstream.pl/rmf_80s' },
        { n: 'RMF 90s', u: 'https://rs201-krk.rmfstream.pl/rmf_90s' },
        { n: 'RMF 2000', u: 'https://rs201-krk.rmfstream.pl/rmf_2000' },
        { n: 'RMF CHILLOUT', u: 'https://rs201-krk.rmfstream.pl/rmf_chillout' },
        { n: 'RMF CLASSIC', u: 'https://rs201-krk.rmfstream.pl/rmf_classic' },
        { n: 'RMF DANCE', u: 'https://rs201-krk.rmfstream.pl/rmf_dance' },
        { n: 'RMF GOLD', u: 'https://rs201-krk.rmfstream.pl/rmf_gold' },
        { n: 'RMF LATINO', u: 'https://rs201-krk.rmfstream.pl/rmf_latino' },
        { n: 'RMF LOVE', u: 'https://rs201-krk.rmfstream.pl/rmf_love' },
        { n: 'RMF PARTY', u: 'https://rs201-krk.rmfstream.pl/rmf_party' },
        { n: 'RMF POLSKI ROCK', u: 'https://rs201-krk.rmfstream.pl/rmf_polski_rock' },
        { n: 'RMF ROCK', u: 'https://rs201-krk.rmfstream.pl/rmf_rock' },
        { n: 'RMF SMOOTH JAZZ', u: 'https://rs201-krk.rmfstream.pl/rmf_smooth_jazz' }
    ];

    const player = document.getElementById('player');
    const playIco = document.getElementById('play-ico');
    let cur = -1;

    // Clock
    setInterval(() => {
        const d = new Date();
        document.getElementById('clock').textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, '0');
    }, 1000);

    // Grid
    const grid = document.getElementById('grid');
    STATIONS.forEach((s, i) => {
        const t = document.createElement('div');
        t.className = 'tile';
        t.innerHTML = `<div class="sub-name">RMF FM</div><div class="main-name">${s.n}</div>`;
        t.onclick = () => play(i);
        grid.appendChild(t);
    });

    function play(idx) {
        cur = idx;
        const s = STATIONS[idx];
        document.querySelectorAll('.tile').forEach((t, i) => t.classList.toggle('active', i === idx));
        document.getElementById('status').textContent = "GRA: " + s.n;
        document.getElementById('logo-name').textContent = s.n;
        player.src = s.u;
        player.play();
        playIco.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z');
    }

    function toggle() {
        if (player.paused) { player.play(); playIco.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z'); }
        else { player.pause(); playIco.setAttribute('d', 'M8,5.14V19.14L19,12.14L8,5.14Z'); }
    }

    function change(dir) {
        let n = cur + dir;
        if (n >= 0 && n < STATIONS.length) play(n);
    }

    function updateVol(v) { player.volume = v / 100; }
    updateVol(50);
</script>

</body>
</html>
