<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber-Yellow Pulse Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #fce300;
            --cyan: #00ffff;
            --bg: #000000;
            --gold: #FFD700;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            touch-action: manipulation; 
            font-family: 'Montserrat Alternates', sans-serif !important; 
        }
        
        html, body { height: 100%; background: var(--bg); color: #fff; overflow: hidden; }
        body { display: flex; flex-direction: row; padding: 20px; gap: 20px; }

        .left-side { flex: 2; display: flex; flex-direction: column; gap: 15px; }
        .header-info { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
        
        .status-msg { font-size: 1.1rem; text-transform: uppercase; font-weight: 600; color: var(--yellow); }
        .clock { font-size: 1.4rem; color: var(--yellow); font-weight: 700; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            gap: 12px; 
            flex: 1; 
        }

        .tile {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
            text-align: center;
            z-index: 5;
            padding: 10px;
            overflow: hidden;
        }
        
        /* Odstęp 0.5cm (ok. 19px) między członami nazwy */
        .tile .station-name .sep { 
            display: inline-block; 
            width: 0.5cm; 
        }

        .tile .station-name { 
            font-size: 1.1rem; 
            color: #fff; 
            font-weight: 700; 
            line-height: 1.1; 
            position: relative;
            z-index: 10;
        }

        .tile.active { border-color: var(--yellow); box-shadow: inset 0 0 15px rgba(252, 227, 0, 0.3); }
        .tile.active .station-name { color: var(--yellow); }

        /* TRZY FALE - spowolnione o połowę (4s zamiast 2s) */
        .tile.active::before,
        .tile.active .wave-2,
        .tile.active .wave-3 {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(252, 227, 0, 0.15); border-radius: 50%; pointer-events: none; z-index: 1;
            width: 0; height: 0;
        }

        .tile.active::before { animation: tilePulse 4s infinite ease-out; }
        .tile.active .wave-2 { animation: tilePulse 4s infinite ease-out 1.33s; }
        .tile.active .wave-3 { animation: tilePulse 4s infinite ease-out 2.66s; }

        @keyframes tilePulse {
            0% { width: 0%; height: 0%; opacity: 0.8; }
            100% { width: 300%; height: 300%; opacity: 0; }
        }

        .right-side { 
            flex: 1; border-left: 1px solid #222; padding-left: 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 25px;
        }

        .logo-box {
            width: 100%; max-width: 280px; aspect-ratio: 16/10;
            border: 3px solid var(--yellow); border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            background: #000; box-shadow: 0 0 40px rgba(252, 227, 0, 0.4);
            font-size: 2.75rem; font-weight: 700; color: var(--yellow);
            text-shadow: 0 0 20px var(--yellow);
        }

        .controls { display: flex; align-items: center; gap: 30px; }
        .mdi-icon { width: 48px; height: 48px; fill: #888; cursor: pointer; transition: 0.2s; }
        .play-btn-main { width: 70px; height: 70px; fill: var(--yellow); }

        /* GŁOŚNOŚĆ - Przyciski w ramkach identycznych jak suwak */
        .volume-area { width: 100%; max-width: 320px; display: flex; align-items: center; gap: 10px; }
        
        .vol-box {
            width: 44px; height: 36px; background: #111; border: 2px solid var(--gold);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--yellow); font-size: 20px; font-weight: bold; transition: 0.2s;
        }
        .vol-box:hover { background: #222; }

        input[type="range"] { 
            flex: 1; height: 36px; background: #111; border: 2px solid var(--gold); 
            border-radius: 8px; appearance: none; padding: 0 6px; cursor: pointer; 
        }
        
        input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--gold); border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { 
            appearance: none; width: 18px; height: 18px; background: var(--gold); 
            border-radius: 50%; margin-top: -7px; box-shadow: 0 0 10px var(--gold); transition: 0.2s;
        }

        /* Przywrócone podświetlenie punktu zero (Cyan) */
        input[type="range"].at-zero::-webkit-slider-thumb {
            box-shadow: 0 0 20px 5px var(--cyan);
            background: #fff;
            transform: scale(1.2);
        }

        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; }
            .right-side { border-left: none; border-top: 1px solid #222; padding: 20px 0; }
            .grid { grid-template-columns: repeat(3, 1fr); height: auto; }
        }
    </style>
</head>
<body>

<div class="left-side">
    <div class="header-info">
        <div class="status-msg" id="statusText">System Ready</div>
        <div class="clock" id="clock">00:00</div>
    </div>
    <div class="grid" id="grid"></div>
</div>

<div class="right-side">
    <div class="logo-box">RMF FM</div>
    
    <div class="controls">
        <svg class="mdi-icon" viewBox="0 0 24 24" onclick="changeStation(-1)"><path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z" /></svg>
        <svg class="mdi-icon play-btn-main" viewBox="0 0 24 24" onclick="togglePlay()"><path id="playPath" d="M8,5.14V19.14L19,12.14L8,5.14Z" /></svg>
        <svg class="mdi-icon" viewBox="0 0 24 24" onclick="changeStation(1)"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z" /></svg>
    </div>

    <div class="volume-area">
        <div class="vol-box" onclick="adjustVol(-5)">-</div>
        <input type="range" id="volume" min="0" max="100" value="50" oninput="updateVolume(this.value)">
        <div class="vol-box" onclick="adjustVol(5)">+</div>
    </div>
</div>

<audio id="player"></audio>

<script>
    const STATIONS = [
        { name: 'RMF FM<span class="sep"></span>Polski rock', url: 'https://rs201-krk.rmfstream.pl/rmf_polski_rock' },
        { name: 'RMF FM<span class="sep"></span>Dance', url: 'https://rs201-krk.rmfstream.pl/rmf_dance' },
        { name: 'RMF FM<span class="sep"></span>80s', url: 'https://rs201-krk.rmfstream.pl/rmf_80s' },
        { name: 'RMF FM<span class="sep"></span>90s', url: 'https://rs201-krk.rmfstream.pl/rmf_90s' },
        { name: 'RMF FM<span class="sep"></span>2000', url: 'https://rs201-krk.rmfstream.pl/rmf_2000' },
        { name: 'RMF FM<span class="sep"></span>Maxxx', url: 'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' },
        { name: 'RMF FM<span class="sep"></span>Classic', url: 'https://rs201-krk.rmfstream.pl/rmf_classic' },
        { name: 'RMF FM<span class="sep"></span>Chillout', url: 'https://rs201-krk.rmfstream.pl/rmf_chillout' },
        { name: 'RMF FM<span class="sep"></span>Gold', url: 'https://rs201-krk.rmfstream.pl/rmf_gold' },
        { name: 'RMF FM<span class="sep"></span>Latino', url: 'https://rs201-krk.rmfstream.pl/rmf_latino' },
        { name: 'RMF FM<span class="sep"></span>Love', url: 'https://rs201-krk.rmfstream.pl/rmf_love' },
        { name: 'RMF FM<span class="sep"></span>Party', url: 'https://rs201-krk.rmfstream.pl/rmf_party' },
        { name: 'RMF FM<span class="sep"></span>Rock', url: 'https://rs201-krk.rmfstream.pl/rmf_rock' },
        { name: 'RMF FM<span class="sep"></span>Jazz', url: 'https://rs201-krk.rmfstream.pl/rmf_smooth_jazz' },
        { name: 'RMF FM<span class="sep"></span>Filmowa', url: 'https://rs201-krk.rmfstream.pl/rmf_muzyka_filmowa' }
    ];

    const player = document.getElementById('player');
    const playPath = document.getElementById('playPath');
    const statusText = document.getElementById('statusText');
    const volumeSlider = document.getElementById('volume');
    let currentIndex = -1;

    player.volume = 0.5;

    setInterval(() => {
        const d = new Date();
        document.getElementById('clock').textContent = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
    }, 1000);

    const grid = document.querySelector('.grid');
    STATIONS.forEach((st, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        // Dodanie divów dla fal pomocniczych
        tile.innerHTML = `<span class="station-name">${st.name}</span><div class="wave-2"></div><div class="wave-3"></div>`;
        tile.onclick = () => playStation(i);
        grid.appendChild(tile);
    });

    function playStation(index) {
        if(index < 0 || index >= STATIONS.length) return;
        currentIndex = index;
        const st = STATIONS[index];
        document.querySelectorAll('.tile').forEach((t, idx) => t.classList.toggle('active', idx === index));
        statusText.textContent = "ŁĄCZENIE...";
        player.pause();
        player.src = st.url;
        player.load();
        player.play().then(() => {
            statusText.innerHTML = "GRA: " + st.name;
            playPath.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z'); 
        }).catch(() => statusText.textContent = "BŁĄD SYGNAŁU");
    }

    function togglePlay() {
        if (currentIndex === -1) { playStation(0); return; }
        if (player.paused) {
            player.play();
            playPath.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z');
        } else {
            player.pause();
            playPath.setAttribute('d', 'M8,5.14V19.14L19,12.14L8,5.14Z'); 
        }
    }

    function changeStation(dir) {
        let n = currentIndex + dir;
        if (n >= 0 && n < STATIONS.length) playStation(n);
    }

    function updateVolume(val) {
        player.volume = val / 100;
        parseInt(val) === 50 ? volumeSlider.classList.add('at-zero') : volumeSlider.classList.remove('at-zero');
    }

    function adjustVol(step) {
        let newVal = Math.min(100, Math.max(0, parseInt(volumeSlider.value) + step));
        volumeSlider.value = newVal;
        updateVolume(newVal);
    }

    updateVolume(50);
</script>
</body>
</html>
