<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI MUZYCZNE RADIO</title>
    <link rel="icon" href="https://panel.radionadawca.pl/radiopanel/data/4556/logo.png" type="image/png">
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; text-align: center; }
        .container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); width: 300px; }
        .logo { width: 100px; height: 100px; margin-bottom: 20px; border-radius: 50%; }
        button { background: #00ffcc; border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; }
        button:hover { transform: scale(1.1); background: #00e6b8; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://panel.radionadawca.pl/radiopanel/data/4556/logo.png" class="logo">
        <h1>Mini Muzyczne</h1>
        <p id="status">RADIO ONLINE</p>
        <button onclick="togglePlay()">PLAY / STOP</button>
        <audio id="player" src="http://shoutcast.radionadawca.pl:8182/stream"></audio>
    </div>

    <script>
        const audio = document.getElementById('player');
        function togglePlay() {
            if (audio.paused) {
                audio.play().catch(() => alert("Kliknij kłódkę w pasku adresu i zezwól na 'Niezabezpieczoną zawartość', aby słuchać!"));
                document.getElementById('status').innerText = "GRA TERAZ!";
            } else {
                audio.pause();
                document.getElementById('status').innerText = "ZATRZYMANE";
            }
        }
    </script>
</body>
</html>
