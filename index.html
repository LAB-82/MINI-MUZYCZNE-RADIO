<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Yellow Pulse Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #fce300;
            --cyan: #00ffff;
            --bg: #000000;
            --tile-border: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
            padding: 20px;
        }

        /* LEWA STRONA - SIATKA */
        .left-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            padding-right: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .header h2 { font-weight: 400; font-size: 1.2rem; color: #ddd; }
        .time { font-size: 1.5rem; font-weight: 600; }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            flex: 1;
        }

        .tile {
            border: 1px solid var(--tile-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            background: rgba(255,255,255,0.02);
            transition: 0.3s;
            color: #888;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
        }

        /* EFEKT PULSE (CYJANOWY) */
        .tile.active {
            border-color: var(--yellow);
            color: var(--yellow);
            box-shadow: inset 0 0 10px var(--yellow);
        }

        .tile.active::before {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 12px;
            border: 2px solid var(--cyan);
            animation: ripple 2s infinite;
            pointer-events: none;
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        /* PRAWA STRONA - ODTWARZACZ */
        .right-panel {
            flex: 1;
            border-left: 1px solid #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-left: 20px;
            text-align: center;
        }

        .brand-title {
            color: var(--yellow);
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .now-playing-card {
            width: 100%;
            max-width: 250px;
            aspect-ratio: 1/1;
            border: 3px solid var(--yellow);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(252, 227, 0, 0.3);
            margin-bottom: 30px;
            background: #000;
        }

        .now-playing-card h1 {
            font-size: 3rem;
            font-style: italic;
            line-height: 1;
        }

        .now-playing-card span { font-size: 1rem; margin-top: 5px; }

        /* STEROWANIE */
        .playback-controls {
            width: 100%;
            max-width: 250px;
        }

        .main-ctrl {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .btn { cursor: pointer; fill: #666; transition: 0.3s; }
        .btn:hover { fill: var(--yellow); }
        .play-btn { fill: var(--yellow); filter: drop-shadow(0 0 5px var(--yellow)); }

        .vol-bar {
            width: 100%;
            height: 2px;
            background: #333;
            position: relative;
            display: flex;
            align-items: center;
        }

        .vol-fill {
            width: 60%;
            height: 100%;
            background: #fff;
        }

        .vol-icons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            opacity: 0.5;
        }

    </style>
</head>
<body>

    <div class="left-panel">
        <div class="header">
            <h2>Wybierz stacje</h2>
            <div class="time" id="clock">09:00</div>
        </div>
        <div class="grid" id="stationGrid"></div>
    </div>

    <div class="right-panel">
        <div class="brand-title">CYBER-YELLOW PULSE</div>
        <div class="now-playing-card" id="activeCard">
            <h1 id="bigLogo">RMF</h1>
            <span id="subLogo">FM</span>
        </div>

        <div class="playback-controls">
            <div class="main-ctrl">
                <svg width="24" height="24" viewBox="0 0 24 24" class="btn"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                <svg width="32" height="32" viewBox="0 0 24 24" class="play-btn"><path d="M8 5v14l11-7z"/></svg>
                <svg width="24" height="24" viewBox="0 0 24 24" class="btn"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </div>
            <div class="vol-bar"><div class="vol-fill"></div></div>
            <div class="vol-icons">
                <small>🔈</small>
                <small>🔊</small>
            </div>
        </div>
    </div>

    <audio id="player"></audio>

    <script>
        const STATIONS = [
            { n: 'RMF FM', u: 'https://rs201-krk.rmfstream.pl/rmf_fm', logo: 'RMF', sub: 'FM' },
            { n: 'Maxx', u: 'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48', logo: 'MAXX', sub: 'RMF' },
            { n: '80s', u: 'https://rs201-krk.rmfstream.pl/rmf_80s', logo: '80s', sub: 'RMF' },
            { n: 'Etc.', u: '', logo: 'ETC', sub: 'RMF' },
            { n: 'Stacja', u: '', logo: 'STACJA', sub: 'RMF' },
            { n: 'FM', u: '', logo: 'FM', sub: 'RMF' },
            { n: 'Lvl.', u: '', logo: 'LVL', sub: 'RMF' },
            { n: 'Met.', u: '', logo: 'MET', sub: 'RMF' },
            { n: '80s', u: '', logo: '80s', sub: 'RMF' },
            { n: 'Moxa', u: '', logo: 'MOXA', sub: 'RMF' },
            { n: 'Tec', u: '', logo: 'TEC', sub: 'RMF' },
            { n: 'Marc', u: '', logo: 'MARC', sub: 'RMF' },
            { n: 'Litscz', u: '', logo: 'LITSCZ', sub: 'RMF' },
            { n: 'Wase', u: '', logo: 'WASE', sub: 'RMF' },
            { n: 'Klyby', u: '', logo: 'KLYBY', sub: 'RMF' }
        ];

        const grid = document.getElementById('stationGrid');
        const player = document.getElementById('player');
        const bigLogo = document.getElementById('bigLogo');
        const subLogo = document.getElementById('subLogo');
        const clock = document.getElementById('clock');

        // CLOCK
        setInterval(() => {
            const now = new Date();
            clock.textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }, 1000);

        // GENERATE GRID
        STATIONS.forEach((st, i) => {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.textContent = st.n;
            tile.onclick = () => {
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                tile.classList.add('active');
                bigLogo.textContent = st.logo;
                subLogo.textContent = st.sub;
                if(st.u) {
                    player.src = st.u;
                    player.play();
                }
            };
            grid.appendChild(tile);
        });
    </script>
</body>
</html>
