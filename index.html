<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Yellow Pulse Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #fce300;
            --cyan: #00ffff;
            --bg: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: var(--bg); color: #fff; font-family: 'Montserrat Alternates', sans-serif; overflow: hidden; }

        body { display: flex; flex-direction: row; padding: 20px; gap: 20px; }

        /* LEWA SEKCJA - TWOJA SIATKA */
        .left-side { flex: 2; display: flex; flex-direction: column; gap: 15px; }
        
        .header-info { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
        .status-msg { color: #fff; font-size: 1.2rem; }
        .clock { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: #fff; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            gap: 12px; 
            flex: 1; 
        }

        /* KAFELEK - TWOJA STRUKTURA */
        .tile {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative; /* Ważne dla fali */
            transition: 0.2s;
            text-align: center;
            font-weight: 700;
            color: #aaa;
            z-index: 1;
        }

        .tile:hover { border-color: var(--yellow); }

        /* AKTYWNY KAFELEK */
        .tile.active {
            border-color: var(--yellow);
            color: var(--yellow);
            box-shadow: inset 0 0 15px rgba(252, 227, 0, 0.2);
        }

        /* FALA - OKRĄGŁA (shockwave) */
        .tile.active::before, .tile.active::after, .wave-3 {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid var(--cyan);
            border-radius: 50%; /* Prawdziwe koło */
            pointer-events: none;
            z-index: -1;
        }

        .tile.active::before { width: 100%; height: 100%; animation: shockwave 2s infinite; }
        .tile.active::after { width: 100%; height: 100%; animation: shockwave 2s infinite 0.6s; }
        
        .wave-inner { position: absolute; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
        .active .wave-inner::after {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid var(--cyan);
            border-radius: 50%;
            width: 100%; height: 100%;
            animation: shockwave 2s infinite 1.2s;
        }

        @keyframes shockwave {
            0% { width: 50px; height: 50px; opacity: 1; }
            100% { width: 250px; height: 250px; opacity: 0; }
        }

        /* PRAWA SEKCJA - TWOJE LOGO I PRZYCISKI */
        .right-side { 
            flex: 1; 
            border-left: 1px solid #222; 
            padding-left: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 25px;
        }

        .cyber-label { color: var(--yellow); font-family: 'Orbitron'; font-size: 0.7rem; letter-spacing: 3px; }

        .logo-box {
            width: 260px;
            height: 180px;
            border: 3px solid var(--yellow);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            box-shadow: 0 0 30px rgba(252, 227, 0, 0.4);
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            text-align: center;
            line-height: 1;
        }

        /* STEROWANIE - TWOJE PARAMETRY */
        .controls { display: flex; align-items: center; gap: 20px; }
        .ctrl-btn { background: none; border: none; cursor: pointer; color: #666; font-size: 1.5rem; transition: 0.2s; }
        .ctrl-btn:hover { color: #fff; }
        .play-btn { color: var(--yellow); font-size: 2.5rem; filter: drop-shadow(0 0 8px var(--yellow)); }

        .volume-area { width: 80%; display: flex; align-items: center; gap: 10px; }
        input[type="range"] { flex: 1; appearance: none; background: #333; height: 2px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; cursor: pointer; }

    </style>
</head>
<body>

<div class="left-side">
    <div class="header-info">
        <div class="status-msg" id="statusText">Wybierz stację</div>
        <div class="clock" id="clock">00:00</div>
    </div>
    <div class="grid" id="grid"></div>
</div>

<div class="right-side">
    <div class="cyber-label">CYBER-YELLOW PULSE</div>
    <div class="logo-box" id="logoBox">RMF FM</div>
    
    <div class="controls">
        <button class="ctrl-btn" onclick="changeStation(-1)">⏮</button>
        <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" onclick="changeStation(1)">⏭</button>
    </div>

    <div class="volume-area">
        <small>🔈</small>
        <input type="range" id="volume" min="0" max="100" value="50" oninput="setVolume(this.value)">
        <small>🔊</small>
    </div>
</div>

<audio id="player"></audio>

<script>
    const STATIONS = [
        { name: 'RMF FM', url: 'https://rs201-krk.rmfstream.pl/rmf_fm' },
        { name: 'Maxx', url: 'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' },
        { name: '80s', url: 'https://rs201-krk.rmfstream.pl/rmf_80s' },
        { name: '90s', url: 'https://rs201-krk.rmfstream.pl/rmf_90s' },
        { name: '2000', url: 'https://rs201-krk.rmfstream.pl/rmf_2000' },
        { name: 'Chill', url: 'https://rs201-krk.rmfstream.pl/rmf_chillout' },
        { name: 'Classic', url: 'https://rs201-krk.rmfstream.pl/rmf_classic' },
        { name: 'Dance', url: 'https://rs201-krk.rmfstream.pl/rmf_dance' },
        { name: 'Gold', url: 'https://rs201-krk.rmfstream.pl/rmf_gold' },
        { name: 'Latino', url: 'https://rs201-krk.rmfstream.pl/rmf_latino' },
        { name: 'Love', url: 'https://rs201-krk.rmfstream.pl/rmf_love' },
        { name: 'Party', url: 'https://rs201-krk.rmfstream.pl/rmf_party' },
        { name: 'P.Rock', url: 'https://rs201-krk.rmfstream.pl/rmf_polski_rock' },
        { name: 'Rock', url: 'https://rs201-krk.rmfstream.pl/rmf_rock' },
        { name: 'Jazz', url: 'https://rs201-krk.rmfstream.pl/rmf_smooth_jazz' }
    ];

    const player = document.getElementById('player');
    const grid = document.getElementById('grid');
    const statusText = document.getElementById('statusText');
    const logoBox = document.getElementById('logoBox');
    const clockDisplay = document.getElementById('clock');
    const playBtn = document.getElementById('playBtn');

    let currentIndex = -1;

    // ZEGAR
    setInterval(() => {
        const d = new Date();
        clockDisplay.textContent = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
    }, 1000);

    // GENEROWANIE KAFELKÓW (15)
    STATIONS.forEach((st, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.innerHTML = `<span>${st.name}</span><div class="wave-inner"></div>`;
        tile.onclick = () => playStation(i);
        grid.appendChild(tile);
    });

    function playStation(index) {
        if(index < 0 || index >= STATIONS.length) return;
        currentIndex = index;
        const st = STATIONS[index];

        document.querySelectorAll('.tile').forEach((t, idx) => t.classList.toggle('active', idx === index));
        
        statusText.textContent = "Ładowanie...";
        logoBox.textContent = st.name;
        player.src = st.url;
        player.play().then(() => {
            statusText.textContent = "Gra: " + st.name;
            playBtn.textContent = "⏸";
        });
    }

    function togglePlay() {
        if (player.paused) { player.play(); playBtn.textContent = "⏸"; }
        else { player.pause(); playBtn.textContent = "▶"; }
    }

    function changeStation(dir) {
        playStation(currentIndex + dir);
    }

    function setVolume(val) {
        player.volume = val / 100;
    }
</script>
</body>
</html>
