<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Yellow Pulse Radio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@600;700&display=swap');

        :root {
            --neon-yellow: #fce300;
            --dark-black: #050505;
            --panel-grey: #0d0d0d;
            --glow-shadow: 0 0 15px rgba(252, 227, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; 
            background: var(--dark-black); 
            color: var(--neon-yellow); 
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* TECH-GRID BACKGROUND */
        body::before {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(252, 227, 0, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(252, 227, 0, 0.05) 1px, transparent 1px);
            background-size: 35px 35px;
            z-index: -1;
        }

        /* HEADER / STATUS */
        .status {
            background: var(--dark-black);
            border-bottom: 2px solid var(--neon-yellow);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.9);
        }

        #statusText { text-transform: uppercase; text-shadow: 0 0 10px var(--neon-yellow); }

        /* GRID CONTAINER */
        .panel {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 1300px;
        }

        /* TILE (KAFELEK) STYLE */
        .tile {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-yellow);
            padding: 25px 10px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            clip-path: polygon(12% 0, 100% 0, 100% 80%, 88% 100%, 0 100%, 0 20%);
        }

        .tile:hover {
            background: rgba(252, 227, 0, 0.15);
            box-shadow: var(--glow-shadow);
            transform: translateY(-3px);
        }

        .tile.active {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 0 0 25px var(--neon-yellow);
            animation: pulse-bg 1.5s infinite linear;
        }

        @keyframes pulse-bg {
            0% { box-shadow: 0 0 10px var(--neon-yellow); }
            50% { box-shadow: 0 0 30px var(--neon-yellow); }
            100% { box-shadow: 0 0 10px var(--neon-yellow); }
        }

        /* LOGO BOX */
        .logo-box {
            background: var(--dark-black);
            padding: 25px;
            text-align: center;
            border-top: 1px solid rgba(252, 227, 0, 0.2);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 8vh;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 15px var(--neon-yellow), 0 0 45px rgba(252, 227, 0, 0.6);
            letter-spacing: 12px;
        }

        /* CONTROLS BAR */
        .controls {
            background: var(--neon-yellow);
            padding: 18px 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
        }

        .ctrl-btn {
            background: #000;
            border: 1px solid #000;
            color: var(--neon-yellow);
            height: 42px;
            padding: 0 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            clip-path: polygon(15% 0, 100% 0, 85% 100%, 0 100%);
        }

        .ctrl-btn:hover:not(:disabled) {
            background: #222;
            color: #fff;
        }

        .ctrl-btn:disabled { opacity: 0.25; cursor: not-allowed; }
        .ctrl-btn.active { background: #fff; color: #000; }

        /* VOLUME SLIDER */
        input[type="range"] {
            flex: 1;
            appearance: none;
            background: #000;
            height: 8px;
            border-radius: 4px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 22px;
            height: 22px;
            background: #000;
            border: 3px solid #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        /* RESPONSIVE */
        @media (max-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 850px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { 
            .grid { grid-template-columns: repeat(2, 1fr); }
            .logo { font-size: 5vh; }
            .controls { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="status">
    <span id="statusText">System Initialized</span>
    <span id="clock">00:00:00</span>
</div>

<div class="panel">
    <div class="grid" id="grid"></div>
</div>

<div class="logo-box">
    <div class="logo" id="displayLogo">RMF FM</div>
</div>

<div class="controls">
    <button class="ctrl-btn" id="playBtn" disabled>PLAY</button>
    <button class="ctrl-btn" id="stopBtn" disabled>STOP</button>
    <button class="ctrl-btn" id="prevBtn" disabled>PREV</button>
    <button class="ctrl-btn" id="nextBtn" disabled>NEXT</button>
    <input type="range" id="volume" min="0" max="100" value="50">
    <button class="ctrl-btn" id="muteBtn">MUTE</button>
</div>

<audio id="player"></audio>

<script>
    const STATIONS = [
        { name:'RMF FM', url:'https://rs201-krk.rmfstream.pl/rmf_fm' },
        { name:'RMF MAXX', url:'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' },
        { name:'RMF 80s', url:'https://rs201-krk.rmfstream.pl/rmf_80s' },
        { name:'RMF 90s', url:'https://rs201-krk.rmfstream.pl/rmf_90s' },
        { name:'RMF 2000', url:'https://rs201-krk.rmfstream.pl/rmf_2000' },
        { name:'RMF CHILLOUT', url:'https://rs201-krk.rmfstream.pl/rmf_chillout' },
        { name:'RMF CLASSIC', url:'https://rs201-krk.rmfstream.pl/rmf_classic' },
        { name:'RMF DANCE', url:'https://rs201-krk.rmfstream.pl/rmf_dance' },
        { name:'RMF GOLD', url:'https://rs201-krk.rmfstream.pl/rmf_gold' },
        { name:'RMF LATINO', url:'https://rs201-krk.rmfstream.pl/rmf_latino' },
        { name:'RMF LOVE', url:'https://rs201-krk.rmfstream.pl/rmf_love' },
        { name:'RMF PARTY', url:'https://rs201-krk.rmfstream.pl/rmf_party' },
        { name:'RMF POLSKI ROCK', url:'https://rs201-krk.rmfstream.pl/rmf_polski_rock' },
        { name:'RMF ROCK', url:'https://rs201-krk.rmfstream.pl/rmf_rock' },
        { name:'RMF SMOOTH JAZZ', url:'https://rs201-krk.rmfstream.pl/rmf_smooth_jazz' }
    ];

    const player = document.getElementById('player');
    const grid = document.getElementById('grid');
    const statusText = document.getElementById('statusText');
    const displayLogo = document.getElementById('displayLogo');
    const clock = document.getElementById('clock');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volume = document.getElementById('volume');
    const muteBtn = document.getElementById('muteBtn');

    let currentIndex = -1;
    let lastVolume = 0.5;
    player.volume = 0.5;

    // CLOCK UPDATE
    setInterval(() => clock.textContent = new Date().toLocaleTimeString(), 1000);

    // GENERATE GRID
    STATIONS.forEach((st, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.innerHTML = `<span>${st.name}</span>`;
        tile.onclick = () => playStation(i);
        grid.appendChild(tile);
    });

    function updateTiles() {
        document.querySelectorAll('.tile').forEach((t, i) => {
            t.classList.toggle('active', i === currentIndex);
        });
    }

    function playStation(index) {
        if(index < 0 || index >= STATIONS.length) return;
        const st = STATIONS[index];
        currentIndex = index;
        
        statusText.textContent = 'CONNECTING: ' + st.name;
        displayLogo.textContent = st.name;
        
        player.src = st.url;
        player.play().then(() => {
            statusText.textContent = 'BROADCASTING: ' + st.name;
            playBtn.classList.add('active');
            [playBtn, stopBtn, prevBtn, nextBtn].forEach(b => b.disabled = false);
            updateTiles();
        }).catch(() => statusText.textContent = 'SIGNAL ERROR');
    }

    playBtn.onclick = () => {
        if (currentIndex === -1) return;
        if (player.paused) {
            player.play();
            playBtn.classList.add('active');
            statusText.textContent = 'BROADCASTING: ' + STATIONS[currentIndex].name;
        } else {
            player.pause();
            playBtn.classList.remove('active');
            statusText.textContent = 'SIGNAL PAUSED';
        }
    };

    stopBtn.onclick = () => {
        player.pause();
        player.src = "";
        playBtn.classList.remove('active');
        statusText.textContent = 'SYSTEM STANDBY';
        currentIndex = -1;
        updateTiles();
    };

    prevBtn.onclick = () => playStation(currentIndex - 1);
    nextBtn.onclick = () => playStation(currentIndex + 1);

    volume.oninput = e => {
        const v = e.target.value / 100;
        player.volume = v;
        if(v > 0) muteBtn.classList.remove('active');
    };

    muteBtn.onclick = () => {
        if (player.volume > 0) {
            lastVolume = player.volume;
            player.volume = 0;
            volume.value = 0;
            muteBtn.classList.add('active');
        } else {
            player.volume = lastVolume || 0.5;
            volume.value = player.volume * 100;
            muteBtn.classList.remove('active');
        }
    };
</script>
</body>
</html>
