<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber-Yellow Pulse Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #fce300;
            --cyan: #00ffff;
            --bg: #000000;
            --gold: #FFD700;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            touch-action: manipulation; 
            font-family: 'Montserrat Alternates', sans-serif !important; 
        }
        
        html, body { height: 100%; background: var(--bg); color: #fff; overflow: hidden; }

        /* STRUKTURA ZAPOŻYCZONA Z KODU POGLĄDOWEGO (ZAWSZE PION NA BODY) */
        body { 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            gap: 10px; 
        }

        /* NAGŁÓWEK (STATUS I ZEGAR) */
        .status-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #333;
            border-radius: 12px;
            flex-shrink: 0;
        }
        .status-msg { font-size: 1.1rem; text-transform: uppercase; font-weight: 600; color: var(--yellow); }
        .clock { font-size: 2rem; color: var(--yellow); font-weight: 700; }

        /* GŁÓWNY KONTENER (ELASTYCZNY DLA DESKTOPU) */
        .main-wrapper {
            display: flex;
            flex-direction: column; /* Domyślnie pion dla mobile */
            gap: 15px;
            flex: 1;
            min-height: 0;
        }

        /* PANEL SIATKI */
        .grid-container {
            flex: 2;
            overflow-y: auto;
            min-height: 0;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
        }

        /* TWOJE ORYGINALNE KAFELKI */
        .tile {
            background: rgba(255, 255, 255, 0.05); border: 1px solid #333;
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; cursor: pointer; position: relative;
            transition: 0.3s; text-align: center; padding: 10px; overflow: hidden;
            min-height: 60px;
        }
        .tile.active { border-color: var(--yellow); box-shadow: inset 0 0 15px rgba(252, 227, 0, 0.3); }
        .tile .station-name { font-size: 0.9rem; color: #fff; font-weight: 700; line-height: 1.1; z-index: 10; }
        .tile .station-name .second-line { display: block; margin-top: 4px; font-size: 0.75rem; }

        /* ANIMACJA PULSOWANIA */
        .tile.active::before, .tile.active .wave-2, .tile.active .wave-3 {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(252, 227, 0, 0.15); border-radius: 50%; pointer-events: none;
            width: 0; height: 0;
        }
        .tile.active::before { animation: tilePulse 4s infinite ease-out; }
        .tile.active .wave-2 { animation: tilePulse 4s infinite ease-out 1.33s; }
        .tile.active .wave-3 { animation: tilePulse 4s infinite ease-out 2.66s; }
        @keyframes tilePulse {
            0% { width: 0%; height: 0%; opacity: 0.8; }
            100% { width: 300%; height: 300%; opacity: 0; }
        }

        /* PANEL BOCZNY (LOGO + STEROWANIE) */
        .side-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        /* TWOJE LOGO */
        .logo-box {
            width: 100%; max-width: 250px;
            border: 3px solid var(--yellow); border-radius: 20px;
            padding: 15px; text-align: center;
            background: #000; box-shadow: 0 0 25px rgba(252, 227, 0, 0.4);
        }
        .logo-text { font-size: 1.8rem; font-weight: 700; color: var(--yellow); }

        /* STEROWANIE */
        .controls { display: flex; align-items: center; gap: 20px; }
        .mdi-icon { width: 40px; height: 40px; fill: #888; cursor: pointer; }
        .play-btn-main { width: 60px; height: 60px; fill: var(--yellow); }

        /* GŁOŚNOŚĆ */
        .volume-area { width: 100%; max-width: 300px; display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
        .vol-box {
            width: 40px; height: 36px; background: #111; border: 2px solid var(--gold);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--yellow); font-weight: bold;
        }
        input[type="range"] { flex: 1; height: 36px; background: #111; border: 2px solid var(--gold); border-radius: 8px; appearance: none; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; background: var(--gold); border-radius: 50%; }
        input[type="range"].at-zero::-webkit-slider-thumb { box-shadow: 0 0 20px 5px var(--cyan); background: #fff; }

        /* --- AUDYT: USTAWIENIA DESKTOP (POWYŻEJ 1024px) --- */
        @media (min-width: 1025px) {
            .main-wrapper { flex-direction: row; }
            .grid { grid-template-columns: repeat(5, 1fr); gap: 12px; }
            .tile { min-height: 85px; }
            .tile .station-name { font-size: 1.1rem; }
            .tile .station-name .second-line { margin-top: 0.5cm; }
            .side-panel { border-left: 1px solid #222; padding-left: 20px; min-width: 350px; }
            .logo-box { max-width: 300px; aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center; }
            .logo-text { font-size: 2.5rem; }
            .mdi-icon { width: 48px; height: 48px; }
            .play-btn-main { width: 75px; height: 75px; }
        }
    </style>
</head>
<body>

<div class="status-bar">
    <div class="status-msg" id="statusText">System Ready</div>
    <div class="clock" id="clock">00:00</div>
</div>

<div class="main-wrapper">
    <div class="grid-container">
        <div class="grid" id="grid"></div>
    </div>

    <div class="side-panel">
        <div class="logo-box">
            <div class="logo-text" id="logoName">RMF FM</div>
        </div>

        <div class="controls">
            <svg class="mdi-icon" viewBox="0 0 24 24" onclick="changeStation(-1)"><path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z" /></svg>
            <svg class="mdi-icon play-btn-main" viewBox="0 0 24 24" onclick="togglePlay()"><path id="playPath" d="M8,5.14V19.14L19,12.14L8,5.14Z" /></svg>
            <svg class="mdi-icon" viewBox="0 0 24 24" onclick="changeStation(1)"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z" /></svg>
        </div>

        <div class="volume-area">
            <div class="vol-box" onclick="adjustVol(-5)">-</div>
            <input type="range" id="volume" min="0" max="100" value="50" oninput="updateVolume(this.value)">
            <div class="vol-box" onclick="adjustVol(5)">+</div>
        </div>
    </div>
</div>

<audio id="player"></audio>

<script>
    const STATIONS = [
        { name: 'RMF FM<span class="second-line">FM</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_fm' },
        { name: 'RMF FM<span class="second-line">Maxx</span>', url: 'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' },
        { name: 'RMF FM<span class="second-line">80s</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_80s' },
        { name: 'RMF FM<span class="second-line">90s</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_90s' },
        { name: 'RMF FM<span class="second-line">2000</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_2000' },
        { name: 'RMF FM<span class="second-line">Chillout</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_chillout' },
        { name: 'RMF FM<span class="second-line">Classic</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_classic' },
        { name: 'RMF FM<span class="second-line">Dance</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_dance' },
        { name: 'RMF FM<span class="second-line">Gold</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_gold' },
        { name: 'RMF FM<span class="second-line">Latino</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_latino' },
        { name: 'RMF FM<span class="second-line">Love</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_love' },
        { name: 'RMF FM<span class="second-line">Party</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_party' },
        { name: 'RMF FM<span class="second-line">Polski Rock</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_polski_rock' },
        { name: 'RMF FM<span class="second-line">Rock</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_rock' },
        { name: 'RMF FM<span class="second-line">Smooth Jazz</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_smooth_jazz' }
    ];

    const player = document.getElementById('player');
    const playPath = document.getElementById('playPath');
    const statusText = document.getElementById('statusText');
    const logoName = document.getElementById('logoName');
    const volumeSlider = document.getElementById('volume');
    let currentIndex = -1;

    setInterval(() => {
        const d = new Date();
        document.getElementById('clock').textContent = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
    }, 1000);

    const grid = document.getElementById('grid');
    STATIONS.forEach((st, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.innerHTML = `<span class="station-name">${st.name}</span><div class="wave-2"></div><div class="wave-3"></div>`;
        tile.onclick = () => playStation(i);
        grid.appendChild(tile);
    });

    function playStation(index) {
        currentIndex = index;
        const st = STATIONS[index];
        document.querySelectorAll('.tile').forEach((t, idx) => t.classList.toggle('active', idx === index));
        statusText.textContent = "ŁĄCZENIE...";
        player.pause(); player.src = st.url; player.load();
        player.play().then(() => {
            const clean = st.name.replace('<span class="second-line">', ' ').replace('</span>', '');
            statusText.innerHTML = "GRA: " + clean;
            logoName.textContent = clean;
            playPath.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z'); 
        });
    }

    function togglePlay() {
        if (currentIndex === -1) { playStation(0); return; }
        if (player.paused) { player.play(); playPath.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z'); }
        else { player.pause(); playPath.setAttribute('d', 'M8,5.14V19.14L19,12.14L8,5.14Z'); }
    }

    function changeStation(dir) {
        let n = currentIndex + dir;
        if (n >= 0 && n < STATIONS.length) playStation(n);
    }

    function updateVolume(val) {
        player.volume = val / 100;
        parseInt(val) === 50 ? volumeSlider.classList.add('at-zero') : volumeSlider.classList.remove('at-zero');
    }

    function adjustVol(step) {
        let newVal = Math.min(100, Math.max(0, parseInt(volumeSlider.value) + step));
        volumeSlider.value = newVal;
        updateVolume(newVal);
    }
    updateVolume(50);
</script>
</body>
</html>
