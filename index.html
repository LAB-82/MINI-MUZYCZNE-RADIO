<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber-Yellow Pulse Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #fce300;
            --cyan: #00ffff;
            --bg: #000000;
            --gold: #FFD700;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            touch-action: manipulation; 
            font-family: 'Montserrat Alternates', sans-serif !important; 
        }
        
        html, body { height: 100%; background: var(--bg); color: #fff; overflow: hidden; }

        body { 
            display: flex; 
            flex-direction: row; 
            padding: 20px; 
            gap: 20px; 
        }

        .left-side { 
            flex: 2; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            min-height: 0; 
        }

        .header-info { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .status-msg { font-size: 1.1rem; text-transform: uppercase; font-weight: 600; color: var(--yellow); }
        
        /* Zegar jak Logo */
        .clock { 
            font-size: 2.5rem; 
            color: var(--yellow); 
            font-weight: 700; 
            text-shadow: 0 0 15px rgba(252, 227, 0, 0.4);
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 12px; 
            flex: 1; 
            min-height: 0;
        }

        .tile {
            background: rgba(255, 255, 255, 0.05); border: 1px solid #333;
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; cursor: pointer; position: relative;
            transition: 0.3s; text-align: center; padding: 5px; overflow: hidden;
        }
        
        /* Podświetlenie kafelka przy najechaniu */
        .tile:hover {
            border-color: var(--yellow);
            background: rgba(255, 255, 0, 0.1);
            box-shadow: 0 0 15px rgba(252, 227, 0, 0.2);
        }
        
        .tile .station-name .second-line { display: block; margin-top: 0.5cm; font-weight: 600; }
        .tile .station-name { font-size: 1.1rem; color: #fff; font-weight: 700; line-height: 1; z-index: 10; }

        .tile.active { border-color: var(--yellow); box-shadow: inset 0 0 15px rgba(252, 227, 0, 0.3); }
        .tile.active .station-name { color: var(--yellow); }

        .tile.active::before, .tile.active .wave-2, .tile.active .wave-3 {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(252, 227, 0, 0.15); border-radius: 50%; pointer-events: none;
            width: 0; height: 0;
        }
        .tile.active::before { animation: tilePulse 4s infinite ease-out; }
        .tile.active .wave-2 { animation: tilePulse 4s infinite ease-out 1.33s; }
        .tile.active .wave-3 { animation: tilePulse 4s infinite ease-out 2.66s; }

        @keyframes tilePulse {
            0% { width: 0%; height: 0%; opacity: 0.8; }
            100% { width: 300%; height: 300%; opacity: 0; }
        }

        .right-side { 
            flex: 1; border-left: 1px solid #222; padding-left: 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 25px;
            min-width: 300px;
        }

        .logo-box {
            width: 100%; max-width: 280px; aspect-ratio: 16/10;
            border: 3px solid var(--yellow); border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            background: #000; box-shadow: 0 0 30px rgba(252, 227, 0, 0.4);
            font-size: 2.5rem; font-weight: 700; color: var(--yellow);
            text-shadow: 0 0 15px rgba(252, 227, 0, 0.4);
        }

        .controls { display: flex; align-items: center; gap: 25px; }
        .mdi-icon { width: 48px; height: 48px; fill: #888; cursor: pointer; transition: 0.2s; }
        .mdi-icon:hover { fill: var(--yellow); filter: drop-shadow(0 0 8px var(--yellow)); }
        .play-btn-main { width: 70px; height: 70px; fill: var(--yellow); }

        .volume-area { width: 100%; max-width: 320px; display: flex; align-items: center; gap: 10px; }
        .vol-box {
            width: 44px; height: 36px; background: #111; border: 2px solid var(--gold);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--yellow); font-weight: bold; transition: 0.2s;
        }
        .vol-box:hover { background: var(--yellow); color: #000; box-shadow: 0 0 10px var(--yellow); }

        input[type="range"] { flex: 1; height: 36px; background: #111; border: 2px solid var(--gold); border-radius: 8px; appearance: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; background: var(--gold); border-radius: 50%; }
        input[type="range"].at-zero::-webkit-slider-thumb { box-shadow: 0 0 20px 5px var(--cyan); background: #fff; }

        /* --- DOPASOWANIE MOBILE (BEZ SCROLLA) --- */

        @media (max-width: 1024px) {
            body { 
                flex-direction: column; 
                height: 100vh; 
                padding: 10px;
                gap: 8px;
            }
            .left-side { flex: 1; min-height: 0; gap: 8px; }
            .grid { 
                grid-template-columns: repeat(3, 1fr); 
                grid-template-rows: repeat(5, 1fr); /* Wymuszenie podziału na 5 rzędów */
                overflow: hidden; /* Usunięcie scrolla */
                gap: 8px;
            }
            .tile { min-height: 0; padding: 2px; }
            .tile .station-name { font-size: 0.9rem; }
            .tile .station-name .second-line { margin-top: 0.2cm; font-size: 0.8rem; }
            
            .right-side { 
                border-left: none; border-top: 1px solid #222; 
                padding: 10px 0; width: 100%; min-width: 0;
                flex: 0 0 auto; 
                gap: 10px;
            }
            .clock { font-size: 1.8rem; }
            .logo-box { max-width: 140px; font-size: 1.4rem; aspect-ratio: 16/8; }
            .play-btn-main { width: 50px; height: 50px; }
            .mdi-icon { width: 35px; height: 35px; }
        }

        @media (max-height: 500px) and (max-width: 1024px) {
            body { flex-direction: row; }
            .left-side { flex: 1.5; }
            .grid { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 1fr); }
            .right-side { flex: 1; border-top: none; border-left: 1px solid #222; padding-left: 10px; padding-top: 0; }
        }

        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

<div class="left-side">
    <div class="header-info">
        <div class="status-msg" id="statusText">System Ready</div>
        <div class="clock" id="clock">00:00</div>
    </div>
    <div class="grid" id="grid"></div>
</div>

<div class="right-side">
    <div class="logo-box">RMF FM</div>
    <div class="controls">
        <svg class="mdi-icon" viewBox="0 0 24 24" onclick="changeStation(-1)"><path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z" /></svg>
        <svg class="mdi-icon play-btn-main" viewBox="0 0 24 24" onclick="togglePlay()"><path id="playPath" d="M8,5.14V19.14L19,12.14L8,5.14Z" /></svg>
        <svg class="mdi-icon" viewBox="0 0 24 24" onclick="changeStation(1)"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z" /></svg>
    </div>
    <div class="volume-area">
        <div class="vol-box" onclick="adjustVol(-5)">-</div>
        <input type="range" id="volume" min="0" max="100" value="50" oninput="updateVolume(this.value)">
        <div class="vol-box" onclick="adjustVol(5)">+</div>
    </div>
</div>

<audio id="player"></audio>

<script>
    const STATIONS = [
        { name: 'RMF FM<span class="second-line">FM</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_fm' },
        { name: 'RMF FM<span class="second-line">Maxx</span>', url: 'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' },
        { name: 'RMF FM<span class="second-line">80s</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_80s' },
        { name: 'RMF FM<span class="second-line">90s</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_90s' },
        { name: 'RMF FM<span class="second-line">2000</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_2000' },
        { name: 'RMF FM<span class="second-line">Chillout</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_chillout' },
        { name: 'RMF FM<span class="second-line">Classic</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_classic' },
        { name: 'RMF FM<span class="second-line">Dance</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_dance' },
        { name: 'RMF FM<span class="second-line">Gold</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_gold' },
        { name: 'RMF FM<span class="second-line">Latino</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_latino' },
        { name: 'RMF FM<span class="second-line">Love</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_love' },
        { name: 'RMF FM<span class="second-line">Party</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_party' },
        { name: 'RMF FM<span class="second-line">Polski Rock</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_polski_rock' },
        { name: 'RMF FM<span class="second-line">Rock</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_rock' },
        { name: 'RMF FM<span class="second-line">Smooth Jazz</span>', url: 'https://rs201-krk.rmfstream.pl/rmf_smooth_jazz' }
    ];

    const player = document.getElementById('player');
    const playPath = document.getElementById('playPath');
    const statusText = document.getElementById('statusText');
    const volumeSlider = document.getElementById('volume');
    let currentIndex = -1;

    setInterval(() => {
        const d = new Date();
        document.getElementById('clock').textContent = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
    }, 1000);

    const grid = document.getElementById('grid');
    STATIONS.forEach((st, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.innerHTML = `<span class="station-name">${st.name}</span><div class="wave-2"></div><div class="wave-3"></div>`;
        tile.onclick = () => playStation(i);
        grid.appendChild(tile);
    });

    function playStation(index) {
        currentIndex = index;
        const st = STATIONS[index];
        document.querySelectorAll('.tile').forEach((t, idx) => t.classList.toggle('active', idx === index));
        statusText.textContent = "ŁĄCZENIE...";
        player.pause(); player.src = st.url; player.load();
        player.play().then(() => {
            statusText.innerHTML = "GRA: " + st.name.replace('<span class="second-line">', ' ').replace('</span>', '');
            playPath.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z'); 
        });
    }

    function togglePlay() {
        if (currentIndex === -1) { playStation(0); return; }
        if (player.paused) { player.play(); playPath.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z'); }
        else { player.pause(); playPath.setAttribute('d', 'M8,5.14V19.14L19,12.14L8,5.14Z'); }
    }

    function changeStation(dir) {
        let n = currentIndex + dir;
        if (n >= 0 && n < STATIONS.length) playStation(n);
    }

    function updateVolume(val) {
        player.volume = val / 100;
        parseInt(val) === 50 ? volumeSlider.classList.add('at-zero') : volumeSlider.classList.remove('at-zero');
    }

    function adjustVol(step) {
        let newVal = Math.min(100, Math.max(0, parseInt(volumeSlider.value) + step));
        volumeSlider.value = newVal;
        updateVolume(newVal);
    }

    updateVolume(50);
</script>
</body>
</html>
