<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RMF TERMINAL - FINAL RECONSTRUCTION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap');

        :root {
            --yellow: #fce300;
            --bg: #000;
            --tile-bg: #111;
            --border: #222;
            --cyan: #00ffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            height: 100vh; width: 100vw; 
            background: var(--bg); color: #fff; 
            font-family: 'Montserrat Alternates', sans-serif;
            overflow: hidden; 
        }

        body { display: flex; flex-direction: column; padding: 2vh; }

        /* HEADER */
        header { 
            height: 8vh; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .gra-label { font-size: 2vh; font-weight: 700; color: #fff; }
        .clock { color: var(--yellow); font-size: 3vh; font-weight: 700; }

        /* KONTENER GŁÓWNY */
        .main-wrapper { display: flex; flex: 1; gap: 2vw; min-height: 0; margin-top: 2vh; }

        /* SIATKA 5x3 */
        .grid { 
            flex: 1; display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            gap: 1vh; 
        }

        .tile {
            background: var(--tile-bg); border: 1px solid var(--border); border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; overflow: hidden;
        }

        /* UKŁAD NAPISÓW (ZGODNIE ZE ZDJĘCIEM 1) */
        .tile .sub-text { font-size: 1.1vh; color: #888; font-weight: 600; text-transform: uppercase; margin-bottom: 0.5vh; }
        .tile .main-text { font-size: 2vh; font-weight: 700; text-align: center; color: #fff; line-height: 1.1; }

        /* AKTYWNY KAFELEK I FALE (ZGODNIE ZE ZDJĘCIEM 4) */
        .tile.active { border: 2px solid var(--yellow); }
        .tile.active .main-text { color: var(--yellow); }
        
        .wave-container {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            pointer-events: none; display: flex; align-items: center; justify-content: center;
        }
        .wave {
            position: absolute; border: 2px solid var(--cyan); border-radius: 50%;
            width: 0; height: 0; opacity: 0;
        }
        .tile.active .wave { animation: pulse 3s infinite ease-out; }
        .tile.active .wave:nth-child(2) { animation-delay: 1s; }
        .tile.active .wave:nth-child(3) { animation-delay: 2s; }

        @keyframes pulse {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 300%; height: 300%; opacity: 0; }
        }

        /* PRAWY PANEL / DOLNY PANEL */
        .control-aside { 
            width: 30vw; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; gap: 4vh;
        }

        /* LOGO BOX */
        .logo-box {
            border: 2px solid var(--yellow); border-radius: 20px;
            width: 80%; padding: 4vh 1vh; text-align: center;
            background: rgba(252, 227, 0, 0.05);
            box-shadow: 0 0 20px rgba(252, 227, 0, 0.2);
        }
        .logo-box h2 { font-size: 4vh; color: var(--yellow); }
        .logo-box p { font-size: 1.2vh; color: var(--yellow); margin-top: 1vh; font-weight: 700; }

        /* PRZYCISKI */
        .transport { display: flex; align-items: center; gap: 2.5vw; }
        .btn-svg { width: 4vh; height: 4vh; fill: #666; cursor: pointer; }
        .btn-play { width: 7vh; height: 7vh; fill: var(--yellow); }

        /* GŁOŚNOŚĆ */
        .volume-box { display: flex; align-items: center; gap: 1vw; width: 80%; }
        input[type="range"] { flex: 1; appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-runnable-track { background: #333; height: 6px; border-radius: 3px; border: 1px solid var(--yellow); }
        input[type="range"]::-webkit-slider-thumb { 
            appearance: none; width: 2vh; height: 2vh; background: var(--cyan); border-radius: 50%; margin-top: -0.8vh;
        }

        /* WERSJA MOBILE PORTRAIT (ZDJĘCIE 5) */
        @media (max-width: 600px) and (orientation: portrait) {
            .main-wrapper { flex-direction: column; }
            .grid { 
                grid-template-columns: repeat(3, 1fr); 
                grid-template-rows: repeat(5, 1fr);
                height: 55vh; flex: none;
            }
            .control-aside { 
                width: 100%; height: 35vh; gap: 2vh; 
                border-top: 1px solid var(--border); padding-top: 1vh;
            }
            .logo-box { padding: 2vh; margin-bottom: 1vh; }
            .logo-box h2 { font-size: 3vh; }
            .transport { margin-bottom: 1vh; }
        }

        /* WERSJA MOBILE LANDSCAPE (ZDJĘCIE 4) */
        @media (max-height: 500px) and (orientation: landscape) {
            header { height: 12vh; }
            .grid { gap: 0.5vh; }
            .control-aside { gap: 2vh; }
            .logo-box { padding: 1vh; }
        }
    </style>
</head>
<body>

<header>
    <div class="gra-label" id="playing-title">GRA: RMF FM</div>
    <div class="clock" id="clock">00:00</div>
</header>

<div class="main-wrapper">
    <div class="grid" id="grid"></div>

    <div class="control-aside">
        <div class="logo-box">
            <h2 id="display-name">RMF FM</h2>
            <p>NAJLEPSZA MUZYKA</p>
        </div>

        <div class="transport">
            <svg class="btn-svg" viewBox="0 0 24 24" onclick="changeStation(-1)"><path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z"/></svg>
            <svg class="btn-svg btn-play" viewBox="0 0 24 24" onclick="togglePlay()"><path id="play-path" d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>
            <svg class="btn-svg" viewBox="0 0 24 24" onclick="changeStation(1)"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z"/></svg>
        </div>

        <div class="volume-box">
            <svg style="width:2vh;fill:var(--yellow)" viewBox="0 0 24 24"><path d="M3,9H7L12,4V20L7,15H3V9Z"/></svg>
            <input type="range" id="vol" min="0" max="100" value="50" oninput="setVol(this.value)">
            <svg style="width:2vh;fill:var(--yellow)" viewBox="0 0 24 24"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.01,19.86 21,16.28 21,12C21,7.72 18.01,4.14 14,3.23Z"/></svg>
        </div>
    </div>
</div>

<audio id="audio"></audio>

<script>
    const STATIONS = [
        { n: 'RMF FM', u: 'https://rs201-krk.rmfstream.pl/rmf_fm' },
        { n: 'RMF MAXXX', u: 'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' },
        { n: 'RMF 80s', u: 'https://rs201-krk.rmfstream.pl/rmf_80s' },
        { n: 'RMF 90s', u: 'https://rs201-krk.rmfstream.pl/rmf_90s' },
        { n: 'RMF 2000', u: 'https://rs201-krk.rmfstream.pl/rmf_2000' },
        { n: 'RMF CHILLOUT', u: 'https://rs201-krk.rmfstream.pl/rmf_chillout' },
        { n: 'RMF CLASSIC', u: 'https://rs201-krk.rmfstream.pl/rmf_classic' },
        { n: 'RMF DANCE', u: 'https://rs201-krk.rmfstream.pl/rmf_dance' },
        { n: 'RMF GOLD', u: 'https://rs201-krk.rmfstream.pl/rmf_gold' },
        { n: 'RMF LATINO', u: 'https://rs201-krk.rmfstream.pl/rmf_latino' },
        { n: 'RMF LOVE', u: 'https://rs201-krk.rmfstream.pl/rmf_love' },
        { n: 'RMF PARTY', u: 'https://rs201-krk.rmfstream.pl/rmf_party' },
        { n: 'RMF POLSKI ROCK', u: 'https://rs201-krk.rmfstream.pl/rmf_polski_rock' },
        { n: 'RMF ROCK', u: 'https://rs201-krk.rmfstream.pl/rmf_rock' },
        { n: 'RMF SMOOTH JAZZ', u: 'https://rs201-krk.rmfstream.pl/rmf_smooth_jazz' }
    ];

    const audio = document.getElementById('audio'), playPath = document.getElementById('play-path'), grid = document.getElementById('grid');
    let current = -1;

    function updateClock() {
        const d = new Date();
        document.getElementById('clock').textContent = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
    }
    setInterval(updateClock, 1000); updateClock();

    STATIONS.forEach((s, i) => {
        const t = document.createElement('div');
        t.className = 'tile';
        t.innerHTML = `
            <div class="wave-container"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div>
            <div class="sub-text">RMF FM</div>
            <div class="main-text">${s.n.replace('RMF ', '')}</div>
        `;
        t.onclick = () => playStation(i);
        grid.appendChild(t);
    });

    function playStation(i) {
        current = i;
        document.querySelectorAll('.tile').forEach((t, idx) => t.classList.toggle('active', idx === i));
        document.getElementById('playing-title').textContent = "GRA: " + STATIONS[i].n;
        document.getElementById('display-name').textContent = STATIONS[i].n;
        audio.src = STATIONS[i].u; audio.play();
        playPath.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z');
    }

    function togglePlay() {
        if(audio.paused) { audio.play(); playPath.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z'); }
        else { audio.pause(); playPath.setAttribute('d', 'M8,5.14V19.14L19,12.14L8,5.14Z'); }
    }

    function changeStation(dir) {
        let n = current + dir;
        if(n >= 0 && n < STATIONS.length) playStation(n);
    }

    function setVol(v) { audio.volume = v / 100; }
</script>
</body>
</html>
