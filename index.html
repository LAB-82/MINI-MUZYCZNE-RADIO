<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI RADIO PL | CYBER-PULSE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --yellow: #fce300;
            --dark-bg: #050505;
            --panel-bg: #0d0d0d;
            --glow: rgba(252, 227, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; 
            background: var(--dark-bg); 
            color: var(--yellow); 
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* BACKGROUND EFFECT */
        body::before {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(252, 227, 0, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(252, 227, 0, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        /* STATUS BAR */
        .status {
            background: var(--panel-bg);
            border-bottom: 2px solid var(--yellow);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #statusText { 
            text-transform: uppercase; 
            text-shadow: 0 0 8px var(--yellow);
        }

        /* MAIN PANEL */
        .panel {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 1300px;
        }

        /* TILE STYLE */
        .tile {
            background: rgba(252, 227, 0, 0.05);
            border: 1px solid var(--yellow);
            padding: 20px;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 700;
            clip-path: polygon(10% 0, 100% 0, 100% 80%, 90% 100%, 0 100%, 0 20%);
        }

        .tile:hover {
            background: var(--yellow);
            color: #000;
            box-shadow: 0 0 20px var(--yellow);
            transform: scale(1.05);
        }

        .tile.active {
            background: var(--yellow);
            color: #000;
            box-shadow: 0 0 30px var(--yellow);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* LOGO BOX */
        .logo-box {
            background: var(--panel-bg);
            padding: 10px;
            text-align: center;
            border-top: 1px solid rgba(252, 227, 0, 0.2);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 6vh;
            font-weight: 700;
            color: var(--yellow);
            text-shadow: 0 0 15px var(--yellow);
            letter-spacing: 10px;
        }

        /* CONTROLS */
        .controls {
            background: var(--yellow);
            padding: 15px 25px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
        }

        .ctrl-btn {
            background: #000;
            border: 1px solid #000;
            color: var(--yellow);
            height: 40px;
            padding: 0 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            clip-path: polygon(15% 0, 100% 0, 85% 100%, 0 100%);
        }

        .ctrl-btn:hover:not(:disabled) {
            background: #222;
            color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .ctrl-btn.active {
            background: #fff;
            color: #000;
        }

        /* SLIDER */
        input[type="range"] {
            flex: 1;
            appearance: none;
            background: #000;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            background: #000;
            border: 2px solid #000;
            cursor: pointer;
            border-radius: 50%;
        }

        /* RESPONSIVE */
        @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { 
            .grid { grid-template-columns: repeat(2, 1fr); }
            .logo { font-size: 4vh; }
            .controls { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<div class="status">
    <span id="statusText">System Ready</span>
    <span id="clock">00:00:00</span>
</div>

<div class="panel">
    <div class="grid" id="grid"></div>
</div>

<div class="logo-box">
    <div class="logo" id="displayLogo">RMF FM</div>
</div>

<div class="controls">
    <button class="ctrl-btn" id="playBtn" disabled>PLAY</button>
    <button class="ctrl-btn" id="stopBtn" disabled>STOP</button>
    <button class="ctrl-btn" id="prevBtn" disabled>PREV</button>
    <button class="ctrl-btn" id="nextBtn" disabled>NEXT</button>
    <input type="range" id="volume" min="0" max="100" value="50">
    <button class="ctrl-btn" id="muteBtn">MUTE</button>
</div>

<audio id="player"></audio>

<script>
    const STATIONS = [
        { name: 'RMF FM', url: 'https://rs201-krk.rmfstream.pl/rmf_fm' },
        { name: 'RMF MAXX', url: 'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' },
        { name: 'RMF 80s', url: 'https://rs201-krk.rmfstream.pl/rmf_80s' },
        { name: 'RMF 90s', url: 'https://rs201-krk.rmfstream.pl/rmf_90s' },
        { name: 'RMF 2000', url: 'https://rs201-krk.rmfstream.pl/rmf_2000' },
        { name: 'RMF CHILLOUT', url: 'https://rs201-krk.rmfstream.pl/rmf_chillout' },
        { name: 'RMF CLASSIC', url: 'https://rs201-krk.rmfstream.pl/rmf_classic' },
        { name: 'RMF DANCE', url: 'https://rs201-krk.rmfstream.pl/rmf_dance' },
        { name: 'RMF GOLD', url: 'https://rs201-krk.rmfstream.pl/rmf_gold' },
        { name: 'RMF LATINO', url: 'https://rs201-krk.rmfstream.pl/rmf_latino' },
        { name: 'RMF LOVE', url: 'https://rs201-krk.rmfstream.pl/rmf_love' },
        { name: 'RMF PARTY', url: 'https://rs201-krk.rmfstream.pl/rmf_party' },
        { name: 'RMF POLSKI ROCK', url: 'https://rs201-krk.rmfstream.pl/rmf_polski_rock' },
        { name: 'RMF ROCK', url: 'https://rs201-krk.rmfstream.pl/rmf_rock' },
        { name: 'RMF SMOOTH JAZZ', url: 'https://rs201-krk.rmfstream.pl/rmf_smooth_jazz' }
    ];

    const player = document.getElementById('player');
    const grid = document.getElementById('grid');
    const statusText = document.getElementById('statusText');
    const displayLogo = document.getElementById('displayLogo');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volume = document.getElementById('volume');
    const muteBtn = document.getElementById('muteBtn');
    const clock = document.getElementById('clock');

    let currentIndex = -1;
    let lastVolume = 0.5;
    player.volume = 0.5;

    // CLOCK
    setInterval(() => clock.textContent = new Date().toLocaleTimeString(), 1000);

    // GRID GENERATION
    STATIONS.forEach((st, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.innerHTML = `<span>${st.name}</span>`;
        tile.onclick = () => playStation(i);
        grid.appendChild(tile);
    });

    function updateUI() {
        document.querySelectorAll('.tile').forEach((t, i) => {
            t.classList.toggle('active', i === currentIndex);
        });
    }

    function playStation(index) {
        if(index < 0 || index >= STATIONS.length) return;
        const st = STATIONS[index];
        currentIndex = index;
        
        statusText.textContent = 'LINKING: ' + st.name;
        displayLogo.textContent = st.name;
        
        player.src = st.url;
        player.play()
            .then(() => {
                statusText.textContent = 'ON AIR: ' + st.name;
                playBtn.classList.add('active');
                [playBtn, stopBtn, prevBtn, nextBtn].forEach(b => b.disabled = false);
                updateUI();
            })
            .catch(err => {
                statusText.textContent = 'ERROR: LINK BLOCKED';
            });
    }

    playBtn.onclick = () => {
        if (player.paused) {
            player.play();
            playBtn.classList.add('active');
            statusText.textContent = 'ON AIR: ' + STATIONS[currentIndex].name;
        } else {
            player.pause();
            playBtn.classList.remove('active');
            statusText.textContent = 'SIGNAL PAUSED';
        }
    };

    stopBtn.onclick = () => {
        player.pause();
        player.src = "";
        playBtn.classList.remove('active');
        statusText.textContent = 'SIGNAL TERMINATED';
        currentIndex = -1;
        updateUI();
    };

    prevBtn.onclick = () => playStation(currentIndex - 1);
    nextBtn.onclick = () => playStation(currentIndex + 1);

    volume.oninput = e => {
        const vol = e.target.value / 100;
        player.volume = vol;
        if(vol > 0) muteBtn.classList.remove('active');
    };

    muteBtn.onclick = () => {
        if (player.volume > 0) {
            lastVolume = player.volume;
            player.volume = 0;
            volume.value = 0;
            muteBtn.classList.add('active');
        } else {
            player.volume = lastVolume || 0.5;
            volume.value = player.volume * 100;
            muteBtn.classList.remove('active');
        }
    };
</script>
</body>
</html>
