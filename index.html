<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Yellow Pulse Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #fce300;
            --cyan: #00ffff;
            --bg: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        
        html, body { 
            height: 100%; 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Montserrat Alternates', sans-serif;
            overflow: hidden; 
        }

        body { display: flex; flex-direction: row; padding: 20px; gap: 20px; }

        .left-side { flex: 2; display: flex; flex-direction: column; gap: 15px; }
        
        .header-info { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 10px; 
        }
        
        .status-msg { font-size: 1.1rem; text-transform: uppercase; font-weight: 600; }
        .clock { font-size: 1.4rem; color: var(--yellow); font-weight: 700; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            gap: 12px; 
            flex: 1; 
        }

        /* KAFELEK */
        .tile {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
            text-align: center;
            z-index: 5;
        }
        
        .tile .brand { font-size: 0.8rem; opacity: 0.8; color: #aaa; font-weight: 400; }
        .tile .suffix { font-size: 1.25rem; color: #fff; font-weight: 700; }

        .tile.active { border-color: var(--yellow); box-shadow: inset 0 0 15px rgba(252, 227, 0, 0.3); }
        .tile.active .suffix { color: var(--yellow); }

        /* OKRĄGŁA FALA (PULSE) */
        .tile.active::before, .tile.active::after {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 2px solid var(--cyan); border-radius: 50%; pointer-events: none; z-index: -1;
        }
        .tile.active::before { width: 40px; height: 40px; animation: shockwave 2s infinite; }
        .tile.active::after { width: 40px; height: 40px; animation: shockwave 2s infinite 0.7s; }

        @keyframes shockwave {
            0% { width: 40px; height: 40px; opacity: 1; border-width: 3px; }
            100% { width: 320px; height: 320px; opacity: 0; border-width: 1px; }
        }

        /* PRAWA STRONA */
        .right-side { 
            flex: 1; border-left: 1px solid #222; padding-left: 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 25px;
        }

        .cyber-label { color: var(--yellow); font-size: 0.8rem; letter-spacing: 1px; font-weight: 700; }

        .logo-box {
            width: 100%; max-width: 280px; aspect-ratio: 16/10;
            border: 3px solid var(--yellow); border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            background: #000; box-shadow: 0 0 40px rgba(252, 227, 0, 0.4);
            font-size: 2.75rem;
            font-weight: 700;
            color: var(--yellow);
            text-shadow: 0 0 20px var(--yellow);
        }

        /* PRZYCISKI - MATERIAL DESIGN ICONS (SVG) */
        .controls { display: flex; align-items: center; gap: 30px; }
        
        .md-icon { 
            width: 42px; height: 42px; 
            fill: #888; cursor: pointer; transition: 0.2s; 
        }
        
        .md-icon:hover { fill: #fff; }
        
        .play-btn-svg { 
            width: 65px; height: 65px; 
            fill: var(--yellow); filter: drop-shadow(0 0 10px var(--yellow)); 
        }

        /* SUWAK GŁOŚNOŚCI */
        .volume-area { width: 100%; max-width: 250px; display: flex; align-items: center; gap: 15px; }
        
        .vol-icon { width: 24px; height: 24px; fill: #666; }

        input[type="range"] { 
            flex: 1; appearance: none; background: #333; height: 6px; border-radius: 3px; cursor: pointer; 
        }
        
        input[type="range"]::-webkit-slider-thumb { 
            appearance: none; width: 22px; height: 22px; 
            background: #fff; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px #000;
        }
        
        input[type="range"].changed::-webkit-slider-thumb { 
            background: var(--cyan); box-shadow: 0 0 15px var(--cyan); 
        }

        /* RESPONSIVE */
        @media (max-width: 900px) and (orientation: portrait) {
            body { flex-direction: column; overflow-y: auto; }
            .right-side { border-left: none; border-top: 1px solid #222; padding: 20px 0; }
            .grid { grid-template-columns: repeat(3, 1fr); height: auto; }
        }
    </style>
</head>
<body>

<div class="left-side">
    <div class="header-info">
        <div class="status-msg" id="statusText">WYBIERZ STACJĘ</div>
        <div class="clock" id="clock">00:00</div>
    </div>
    <div class="grid" id="grid"></div>
</div>

<div class="right-side">
    <div class="cyber-label">RMF FM - NAJLEPSZA MUZYKA</div>
    <div class="logo-box">RMF FM</div>
    
    <div class="controls">
        <svg class="md-icon" viewBox="0 0 24 24" onclick="changeStation(-1)">
            <path d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z" />
        </svg>

        <svg class="md-icon play-btn-svg" viewBox="0 0 24 24" onclick="togglePlay()">
            <path id="playPath" d="M8,5.14V19.14L19,12.14L8,5.14Z" />
        </svg>

        <svg class="md-icon" viewBox="0 0 24 24" onclick="changeStation(1)">
            <path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z" />
        </svg>
    </div>

    <div class="volume-area">
        <svg class="vol-icon" viewBox="0 0 24 24">
            <path d="M7,9V15H11L16,20V4L11,9H7Z" />
        </svg>
        
        <input type="range" id="volume" min="0" max="100" value="50" oninput="updateVolume(this.value)">
        
        <svg class="vol-icon" viewBox="0 0 24 24">
            <path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12Z" />
        </svg>
    </div>
</div>

<audio id="player"></audio>

<script>
    const STATIONS = [
        { b: 'RMF FM', s: 'FM', u: 'https://rs201-krk.rmfstream.pl/rmf_fm' },
        { b: 'RMF FM', s: 'Maxx', u: 'https://rs7-krk2-cyfronet.rmfstream.pl/RMFMAXXX48' },
        { b: 'RMF FM', s: '80s', u: 'https://rs201-krk.rmfstream.pl/rmf_80s' },
        { b: 'RMF FM', s: '90s', u: 'https://rs201-krk.rmfstream.pl/rmf_90s' },
        { b: 'RMF FM', s: '2000', u: 'https://rs201-krk.rmfstream.pl/rmf_2000' },
        { b: 'RMF FM', s: 'Chill', u: 'https://rs201-krk.rmfstream.pl/rmf_chillout' },
        { b: 'RMF FM', s: 'Classic', u: 'https://rs201-krk.rmfstream.pl/rmf_classic' },
        { b: 'RMF FM', s: 'Dance', u: 'https://rs201-krk.rmfstream.pl/rmf_dance' },
        { b: 'RMF FM', s: 'Gold', u: 'https://rs201-krk.rmfstream.pl/rmf_gold' },
        { b: 'RMF FM', s: 'Latino', u: 'https://rs201-krk.rmfstream.pl/rmf_latino' },
        { b: 'RMF FM', s: 'Love', u: 'https://rs201-krk.rmfstream.pl/rmf_love' },
        { b: 'RMF FM', s: 'Party', u: 'https://rs201-krk.rmfstream.pl/rmf_party' },
        { b: 'RMF FM', s: 'P.Rock', u: 'https://rs201-krk.rmfstream.pl/rmf_polski_rock' },
        { b: 'RMF FM', s: 'Rock', u: 'https://rs201-krk.rmfstream.pl/rmf_rock' },
        { b: 'RMF FM', s: 'Jazz', u: 'https://rs201-krk.rmfstream.pl/rmf_smooth_jazz' }
    ];

    const player = document.getElementById('player');
    const playPath = document.getElementById('playPath');
    const volumeSlider = document.getElementById('volume');
    const statusText = document.getElementById('statusText');
    let currentIndex = -1;

    player.volume = 0.5;

    // ZEGAR
    setInterval(() => {
        const d = new Date();
        document.getElementById('clock').textContent = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
    }, 1000);

    // GENEROWANIE KAFELKÓW
    const grid = document.querySelector('.grid');
    STATIONS.forEach((st, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.innerHTML = `<span class="brand">${st.b}</span><span class="suffix">${st.s}</span>`;
        tile.onclick = () => playStation(i);
        grid.appendChild(tile);
    });

    function playStation(index) {
        if(index < 0 || index >= STATIONS.length) return;
        currentIndex = index;
        const st = STATIONS[index];

        document.querySelectorAll('.tile').forEach((t, idx) => t.classList.toggle('active', idx === index));
        statusText.textContent = "ŁĄCZENIE...";

        player.pause();
        player.src = st.u;
        player.load();
        
        player.play().then(() => {
            statusText.textContent = "GRA: " + st.b + " " + st.s;
            playPath.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z'); // Material Pause
        }).catch(e => {
            statusText.textContent = "BŁĄD SYGNAŁU";
        });
    }

    function togglePlay() {
        if (currentIndex === -1) { playStation(0); return; }
        if (player.paused) {
            player.play();
            playPath.setAttribute('d', 'M14,19H18V5H14M6,19H10V5H6V19Z');
        } else {
            player.pause();
            playPath.setAttribute('d', 'M8,5.14V19.14L19,12.14L8,5.14Z'); // Material Play
        }
    }

    function changeStation(dir) {
        let n = currentIndex + dir;
        if (n >= 0 && n < STATIONS.length) playStation(n);
    }

    function updateVolume(val) {
        player.volume = val / 100;
        volumeSlider.classList.add('changed');
    }
</script>
</body>
</html>
